name: Security · Library Git Secrets

# Secret scanning for the library itself, callable on its own so a change to the
# scanner configuration can be verified without running the whole CI run.

on:
  workflow_dispatch:
    inputs:
      full-history:
        description: Scan the entire history rather than the pull request range
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      full-history:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit
    with:
      full-history: ${{ inputs.full-history }}
