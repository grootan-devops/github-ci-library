name: Node / Lint

# Counterpart of the GitLab Node:Lint job. Biome is the single source of truth
# for formatting and linting, so the project must declare biome.json.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Path to the Node project root. Monorepo children set this."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  npm_config_cache: ${{ github.workspace }}/.npm
  BIOME_REPORT: biome-report.txt

jobs:
  lint:
    name: biome
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Biome Configuration
        run: |
          set -euo pipefail
          if [[ -f biome.json ]]; then
            echo "biome.json found."
            exit 0
          fi
          echo "::error title=Biome::biome.json not found in ${PROJECT_PATH}. Create it at the project root."
          {
            echo "### 📗 Node lint: biome"
            echo ""
            echo "❌ \`biome.json\` is missing. Create it at the project root:"
            echo ""
            echo '```json'
            echo '{'
            # shellcheck disable=SC2016 # $schema is a JSON key, not a shell variable
            echo '  "$schema": "https://biomejs.dev/schemas/2.3.11/schema.json",'
            echo '  "formatter": { "lineWidth": 320 },'
            echo '  "files": {'
            echo '    "includes": ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.json", "**/*.html", "**/*.css", "**/*.scss", "!!node_modules", "!!dist", "!!coverage"]'
            echo '  }'
            echo '}'
            echo '```'
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Restore npm Cache
        uses: actions/cache/restore@v6
        with:
          path: .npm
          key: node-${{ hashFiles(format('{0}/package-lock.json', inputs.project-path || vars.PROJECT_PATH || '.')) }}
          restore-keys: node-

      - name: Run Biome
        id: biome
        run: |
          set -uo pipefail
          biome check --max-diagnostics=none > "${BIOME_REPORT}" 2>&1
          BIOME_EXIT=$?
          cat "${BIOME_REPORT}"
          exit ${BIOME_EXIT}

      - name: Publish Lint Summary
        if: always()
        env:
          OUTCOME: ${{ steps.biome.outcome }}
        run: |
          set -euo pipefail
          # Biome ends its report with its own tallies ("Checked N files",
          # "Found N errors"). Those lines are the count, already computed — no
          # second pass over the diagnostics to arrive at the same number.
          TALLY="$(grep -E '^(Checked|Found|Fixed|Skipped) ' "${BIOME_REPORT}" 2>/dev/null | tail -n 5 || true)"
          {
            echo "### 📗 Node lint: biome"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ No diagnostics."
            elif [[ -s "${BIOME_REPORT}" ]]; then
              echo "❌ Biome reported diagnostics."
            else
              echo "❌ Biome exited \`${OUTCOME}\` without writing a report — it did not get as far as checking anything."
            fi
            if [[ -n "${TALLY}" ]]; then
              echo ""
              echo '```'
              echo "${TALLY}"
              echo '```'
            fi
            if [[ "${OUTCOME}" != "success" && -s "${BIOME_REPORT}" ]]; then
              echo ""
              echo "<details><summary>Biome diagnostics</summary>"
              echo ""
              echo '```'
              tail -c 60000 "${BIOME_REPORT}"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "Every diagnostic is in the \`node-biome-report\` artifact."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Biome Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-biome-report
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/biome-report.txt
          if-no-files-found: ignore
          retention-days: 7
