name: Trivy / Warm Database Cache

# Counterpart of the GitLab Trivy:Cache:Warm job. Downloads the policy and Java
# databases once per run so every downstream scan restores them instead of each
# pulling them independently.

on:
  workflow_call:
    inputs:
      enable-java-db:
        required: false
        type: string
        default: "auto"
        description: "auto | true | false. auto downloads the Java DB only when pom.xml is present."
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache

permissions:
  contents: read

jobs:
  warm:
    name: Warm Cache
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      # Replaces the immutable trivy-db entry; a caller must grant it.
      actions: write
    # No `permissions:` block on purpose: declaring actions: write would force
    # every caller to grant it or fail at startup. Restores work without it.
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Trivy Database Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .trivycache
          key: trivy-db
          restore-keys: trivy-db

      - name: Warm Vulnerability, Policy & Java Databases
        id: warm
        env:
          ENABLE_JAVA_DB: ${{ inputs.enable-java-db }}
        run: |
          set -euo pipefail

          # The vulnerability database is the whole point of this cache: it is what
          # every image and SBOM scan loads. Warming only the checks and java-db left
          # `db/` absent, so each scan restored ~920MB and then downloaded the ~115MB
          # database anyway -- a cache that cost bandwidth and saved none.
          echo "Warming trivy-db for downstream image and SBOM scans..."
          if trivy image --download-db-only --skip-version-check 2>&1 | tee "${RUNNER_TEMP}/vuln-db.log"; then
            VULN_DB="downloaded"
          else
            VULN_DB="⚠️ **download failed** — every later scan downloads the database itself"
            echo "::warning title=Trivy cache::trivy-db did not download; image and SBOM scans will each fetch it."
          fi
          echo "vuln_db=${VULN_DB}" >> "${GITHUB_OUTPUT}"

          mkdir -p .trivy-checks-warm
          trivy config --skip-version-check .trivy-checks-warm || true
          rmdir .trivy-checks-warm 2>/dev/null || true

          WANT_JAVA="${ENABLE_JAVA_DB}"
          if [[ "${WANT_JAVA}" == "auto" ]]; then
            if [[ -f pom.xml ]]; then WANT_JAVA=true; else WANT_JAVA=false; fi
          fi

          if [[ "${WANT_JAVA}" == "true" ]]; then
            echo "Warming trivy-java-db for downstream image and SBOM scans..."
            # Downstream scans pass --skip-java-db-update, which Trivy treats as
            # fatal on a cold cache, so a failure here fails every later Java scan.
            if trivy image --download-java-db-only --skip-version-check 2>&1 | tee "${RUNNER_TEMP}/java-db.log"; then
              JAVA_DB="downloaded"
            else
              JAVA_DB="⚠️ **download failed** — a later image or SBOM scan of a Java artifact will fail on the cold cache"
              echo "::warning title=Trivy cache::trivy-java-db did not download. Image and SBOM scans of Java artifacts will fail against this cache."
            fi
            echo "java_db=${JAVA_DB}" >> "${GITHUB_OUTPUT}"
          else
            echo "No pom.xml and enable-java-db is not true — skipping trivy-java-db."
          fi

      # GitHub caches are immutable, so a stable key must be deleted before it can
      # be rewritten, or `trivy-db` freezes at whatever the first run stored.
      # Deleting needs actions: write; without it the existing entry just stays.
      - name: Refresh Cache Entry
        id: refresh
        # Deletes the shared entry, so it must run only where that entry lives.
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STAMP=".trivycache/.warmed-on"
          TODAY="$(date -u +%Y-%m-%d)"

          # The caches API matches `key` as a PREFIX, so filter for the exact key.
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=trivy-db" \
            --jq '[.actions_caches[] | select(.key == "trivy-db")] | length' 2>/dev/null || echo 0)"

          if [[ "${EXISTING}" == "0" ]]; then
            mkdir -p .trivycache && echo "${TODAY}" > "${STAMP}"
            echo "No 'trivy-db' entry yet; this run writes it."
            echo "save=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -f "${STAMP}" ]] && [[ "$(cat "${STAMP}")" == "${TODAY}" ]] \
             && compgen -G ".trivycache/db/*" > /dev/null 2>&1; then
            echo "'trivy-db' was already refreshed today and holds the database; keeping it."
            echo "save=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p .trivycache && echo "${TODAY}" > "${STAMP}"
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=trivy-db" >/dev/null 2>&1; then
            echo "Replaced the 'trivy-db' entry with today's databases."
            echo "save=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning title=Trivy cache::Could not replace the 'trivy-db' entry. Grant 'actions: write' in the calling workflow to let it refresh."
            echo "save=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save Trivy Database Cache
        # Default branch only. GitHub scopes every cache entry to the ref that wrote
        # it, and a run can read only its own ref, its base branch and the default
        # branch -- so a write from anywhere else is a duplicate nobody else can use.
        if: ${{ !cancelled() && steps.refresh.outputs.save == 'true'
          && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v6
        with:
          path: .trivycache
          key: trivy-db

      - name: Publish Cache Summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          REFRESHED: ${{ steps.refresh.outputs.save }}
          JAVA_DB: ${{ steps.warm.outputs.java_db }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == "true" ]]; then
            RESTORED="restored from the existing \`trivy-db\` entry"
          else
            RESTORED="rebuilt — no \`trivy-db\` entry matched, so this run downloaded the databases"
          fi
          if [[ "${REFRESHED}" == "true" ]]; then
            WRITTEN="yes — this run replaces the \`trivy-db\` entry"
          else
            WRITTEN="no — already refreshed today, or \`actions: write\` was not granted"
          fi
          SIZE="$(du -sh "${TRIVY_CACHE_DIR}" 2>/dev/null | awk '{print $1}' || true)"
          {
            echo "### 🗄️ Trivy database cache"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Cache** | ${RESTORED} |"
            echo "| **Written back** | ${WRITTEN} |"
            # Set only when the Java DB was actually warmed.
            if [[ -n "${JAVA_DB}" ]]; then
              echo "| **Java DB** | ${JAVA_DB} |"
            fi
            if [[ -n "${SIZE}" ]]; then
              echo "| **Size** | ${SIZE} |"
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
