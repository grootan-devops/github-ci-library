name: Trivy / Warm Database Cache

# Counterpart of the GitLab Trivy:Cache:Warm job. Downloads the policy and Java
# databases once per run so every downstream scan restores them instead of each
# pulling them independently.

on:
  workflow_call:
    inputs:
      enable-java-db:
        required: false
        type: string
        default: "auto"
        description: "auto | true | false. auto downloads the Java DB only when pom.xml is present."
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache

jobs:
  warm:
    name: "Trivy: Warm Cache"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    # Permissions are deliberately inherited rather than declared. Declaring
    # actions: write here would force every caller to grant it or fail the run
    # at startup, and that is too much to ask for a cache refresh. A caller that
    # grants it gets refreshes; one that does not still gets restores.
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Trivy Database Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .trivycache
          key: trivy-db
          restore-keys: trivy-db

      - name: Warm Policy & Java Databases
        env:
          ENABLE_JAVA_DB: ${{ inputs.enable-java-db }}
        run: |
          set -euo pipefail

          mkdir -p .trivy-checks-warm
          trivy config --skip-version-check .trivy-checks-warm || true
          rmdir .trivy-checks-warm 2>/dev/null || true

          WANT_JAVA="${ENABLE_JAVA_DB}"
          if [[ "${WANT_JAVA}" == "auto" ]]; then
            if [[ -f pom.xml ]]; then WANT_JAVA=true; else WANT_JAVA=false; fi
          fi

          if [[ "${WANT_JAVA}" == "true" ]]; then
            echo "Warming trivy-java-db for downstream image and SBOM scans..."
            trivy image --download-java-db-only --skip-version-check
          else
            echo "No pom.xml and enable-java-db is not true — skipping trivy-java-db."
          fi

      # GitLab keys this cache "trivy-db" and pushes over it every pipeline.
      # GitHub caches are immutable, so the entry has to be deleted before the
      # same key can be written again — otherwise "trivy-db" would be frozen at
      # whatever the first run stored and the databases would go stale forever.
      # Refresh at most once a day; every other run just restores.
      - name: Refresh Cache Entry
        id: refresh
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STAMP=".trivycache/.warmed-on"
          TODAY="$(date -u +%Y-%m-%d)"
          if [[ -f "${STAMP}" ]] && [[ "$(cat "${STAMP}")" == "${TODAY}" ]]; then
            echo "Databases were already warmed today; keeping the cached entry."
            echo "save=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mkdir -p .trivycache
          echo "${TODAY}" > "${STAMP}"

          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=trivy-db" >/dev/null 2>&1; then
            echo "Deleted the previous trivy-db entry so this run can write it."
            echo "save=true" >> "${GITHUB_OUTPUT}"
          elif gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=trivy-db" \
                 --jq '.actions_caches | length' 2>/dev/null | grep -qx 0; then
            echo "No previous trivy-db entry; this run writes the first one."
            echo "save=true" >> "${GITHUB_OUTPUT}"
          else
            # Deleting needs actions: write, which the caller may not grant.
            # The existing entry then stays as it is — restores keep working,
            # and Trivy refreshes anything stale in the job itself.
            echo "::warning title=Trivy cache::Could not replace the 'trivy-db' entry. Grant 'actions: write' in the calling workflow to let it refresh."
            echo "save=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Save Trivy Database Cache
        if: ${{ !cancelled() && steps.refresh.outputs.save == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .trivycache
          key: trivy-db

      - name: Publish Cache Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### 🗄️ Trivy database cache"
            echo ""
            echo "Warmed into \`trivy-db\` — $(du -sh .trivycache 2>/dev/null | cut -f1 || echo 'empty')."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
