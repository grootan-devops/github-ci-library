name: Trivy / Warm Database Cache

on:
  workflow_call:
    inputs:
      enable-java-db:
        required: false
        type: boolean
        default: true
        description: >-
          Download trivy-java-db as well. Required by any later image or SBOM scan of a
          Java artifact, which passes --skip-java-db-update and fails on a cold cache.
          It is roughly 900MB, so set false for a repository that ships no JVM artifact.
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache

permissions:
  contents: read

jobs:
  warm:
    name: Warm Cache
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    container:
      image: registry-1.docker.io/grootantech/toolkit:1.0.0
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Restore Trivy Database Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .trivycache
          key: trivy-db
          restore-keys: trivy-db

      - name: Warm Vulnerability, Policy & Java Databases
        id: warm
        env:
          ENABLE_JAVA_DB: ${{ inputs.enable-java-db }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/scan/cache-warm.sh"

      - name: Refresh Cache Entry
        id: refresh
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/scan/cache-refresh.sh"

      - name: Save Trivy Database Cache
        if: ${{ !cancelled() && steps.refresh.outputs.save == 'true' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v6
        with:
          path: .trivycache
          key: trivy-db

      - name: Publish Cache Summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          REFRESHED: ${{ steps.refresh.outputs.save }}
          JAVA_DB: ${{ steps.warm.outputs.java_db }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/scan/cache-summary.sh"
