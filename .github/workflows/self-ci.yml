name: CI · PR Verification
run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

on:
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/self-lint.yml
    secrets: inherit

  secret-scan:
    name: Security
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit

  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  guards:
    name: Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      check-library-pinning: false
