name: CI · PR Verification
run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

on:
  pull_request:
    branches: [master, main, dev]
    paths:
      - ".github/**"
      - "scripts/**"
      - "templates/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "MIGRATION.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/self-lint.yml
    secrets: inherit

  # Calls secret-scanning.yml directly; the self- hop only repeats the job name.
  secret-scan:
    name: Security
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit

  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  # Calls check.yml directly; the self- hop only repeats the job name.
  guards:
    name: Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
