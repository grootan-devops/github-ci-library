name: CI · PR Verification
run-name: "CI · ${{ github.event.pull_request.number && format('PR #{0} · {1}', github.event.pull_request.number, github.head_ref) || format('{0} · #{1}', github.ref_name, github.run_number) }}"

# The library's own pipeline, counterpart of ci-templates/.gitlab-ci.yml.
# An aggregator only: each dimension lives in its own `self-*.yml`, dispatchable alone.

on:
  pull_request:
    branches: [master, main, dev]
    paths:
      - ".github/**"
      - "scripts/**"
      - "templates/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "MIGRATION.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/self-lint.yml
    secrets: inherit

  # Calls secret-scanning.yml directly; the self- hop only repeats the job name.
  secret-scan:
    name: Security
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit

  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  # Calls check.yml directly; the self- hop only repeats the job name.
  guards:
    name: Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
