name: CI · PR Verification

# The library's own pipeline, the counterpart of ci-templates/.gitlab-ci.yml.
# It is only an aggregator: every dimension lives in its own `self-*.yml`
# workflow with a `workflow_dispatch` trigger, so a developer working on lint,
# on the release guards or on secret scanning can run just that one.

on:
  pull_request:
    branches: [master, main, dev]
    paths:
      - ".github/**"
      - "scripts/**"
      - "templates/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "MIGRATION.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/self-lint.yml
    secrets: inherit

  # Calls secret-scanning.yml directly rather than through self-secret-scan.yml,
  # for the same reason `guards` calls check.yml directly: self-secret-scan.yml
  # only forwards one input, and the extra hop made this read
  # "Security / Secret Scan / Secret Scan". It still exists for a standalone
  # dispatch with full-history on.
  secret-scan:
    name: Security
    uses: ./.github/workflows/secret-scanning.yml
    secrets: inherit

  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  # Calls check.yml directly rather than through self-check.yml. Each reusable
  # hop prefixes the job name, and "Check / Release Guards / Check: Migration
  # Guide" said one thing three times. self-check.yml still exists for a
  # standalone dispatch.
  guards:
    name: Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
