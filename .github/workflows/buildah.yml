name: Image / Buildah Build, Push & Promote

# Counterpart of the GitLab buildah Image:Build job, plus the shared push and
# promote steps. Builds a minimal image from a base image without a Dockerfile,
# inside the organisation's buildah/podman build container.

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
        description: "Tag to publish, from init.yml's image-push-tag."
      image-repository:
        required: true
        type: string
        description: "Repository to push to, from init.yml's image-push-repository."
      base-image-repo:
        required: false
        type: string
        default: ""
        description: "Base image repository. Defaults to vars.MICRO_ROOT_BASE_IMAGE's repository."
      base-image-tag:
        required: false
        type: string
        default: ""
        description: "Base image tag."
      install-packages:
        required: false
        type: string
        default: ""
        description: "Space-separated packages to microdnf install."
      required-packages:
        required: false
        type: string
        default: ""
        description: "Space-separated packages to keep when the package manager is purged."
      force-remove-packages:
        required: false
        type: string
        default: ""
        description: "Space-separated extra packages to remove."
      required-rpms:
        required: false
        type: string
        default: ""
        description: "Space-separated RPM URLs or paths to install directly."
      container-env-vars:
        required: false
        type: string
        default: ""
        description: "Space-separated names of environment variables to bake into the image."
      container-path-env:
        required: false
        type: string
        default: ""
        description: "Prepended to the image's PATH."
      container-entrypoint:
        required: false
        type: string
        default: ""
        description: "Image ENTRYPOINT."
      container-cmd:
        required: false
        type: string
        default: ""
        description: "Image CMD."
      is-release:
        required: false
        type: boolean
        default: false
        description: "true on a production release: promote the scanned candidate instead of rebuilding."
      release-tag:
        required: false
        type: string
        default: ""
        description: "Production tag to promote to, from init.yml's tag."
      candidate-tag:
        required: false
        type: string
        default: ""
        description: "Exact candidate tag to promote, from init.yml."
      image-dev-repository:
        required: false
        type: string
        default: ""
        description: "Candidate repository to promote from, from init.yml."
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."

    outputs:
      image-ref-digest:
        description: "Digest-pinned reference of the published image"
        value: ${{ jobs.build.outputs.IMAGE_REF_DIGEST }}

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_NAME: dockerimage:internal
  IMAGE_TAR_FILE_NAME: image.tar.gz
  IMAGE_INFO_FILE_NAME: IMAGE_INFO.md
  INSTALLED_PCKG_FILE_NAME: installed_pkgs.txt

jobs:
  build:
    name: "Image: Buildah Build & Push"
    if: ${{ !inputs.is-release }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
      # buildah needs to mount the container filesystem it is assembling.
      options: --privileged
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    outputs:
      IMAGE_REF_DIGEST: ${{ steps.push.outputs.IMAGE_REF_DIGEST }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Resolve Base Image
        id: base
        env:
          BASE_REPO_INPUT: ${{ inputs.base-image-repo }}
          BASE_TAG_INPUT: ${{ inputs.base-image-tag }}
          DEFAULT_BASE: ${{ vars.MICRO_ROOT_BASE_IMAGE }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REPO_INPUT}" ]]; then
            REPO="${BASE_REPO_INPUT}"
            TAG="${BASE_TAG_INPUT:?base-image-tag is required when base-image-repo is set}"
          else
            REPO="${REGISTRY_HOST}/${DEFAULT_BASE%%:*}"
            TAG="${DEFAULT_BASE##*:}"
          fi
          echo "Base image: ${REPO}:${TAG}"
          {
            echo "repo=${REPO}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build Image
        env:
          BASE_IMAGE_REPO: ${{ steps.base.outputs.repo }}
          BASE_IMAGE_TAG: ${{ steps.base.outputs.tag }}
          REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          INSTALL_PKGS: ${{ inputs.install-packages }}
          REQUIRED_PKGS: ${{ inputs.required-packages }}
          FORCE_REMOVE_PKGS: ${{ inputs.force-remove-packages }}
          REQUIRED_RPMS: ${{ inputs.required-rpms }}
          CONTAINER_ENV_VARS: ${{ inputs.container-env-vars }}
          CONTAINER_PATH_ENV: ${{ inputs.container-path-env }}
          CONTAINER_ENTRYPOINT: ${{ inputs.container-entrypoint }}
          CONTAINER_CMD: ${{ inputs.container-cmd }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/buildah-build.sh"

      - name: Push Image
        id: push
        env:
          REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          podman login "${REGISTRY_HOST}" --username "${REGISTRY_USERNAME}" --password "${REGISTRY_PASSWORD}"

          TARGET="${REGISTRY_HOST}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          podman tag "${IMAGE_NAME}" "${TARGET}"
          podman push "${TARGET}"

          DIGEST="$(podman image inspect "${TARGET}" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          REF="${REGISTRY_HOST}/${IMAGE_REPOSITORY}@${DIGEST}"
          echo "IMAGE_REF_DIGEST=${REF}" >> "${GITHUB_OUTPUT}"

          {
            echo "### 🐳 Container Image"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Tag** | \`${TARGET}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Pinned reference** | \`${REF}\` |"
            echo ""
          } > "${IMAGE_INFO_FILE_NAME}"
          cat "${IMAGE_INFO_FILE_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Image Tar & Package List
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/image.tar.gz
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/installed_pkgs.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Image Info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-info
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/IMAGE_INFO.md
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/installed_pkgs.txt
          if-no-files-found: ignore
          retention-days: 7

  promote:
    name: "Image: Promote"
    if: ${{ inputs.is-release }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Promote Candidate Image To Production
        env:
          REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          TAG: ${{ inputs.release-tag }}
          CANDIDATE_TAG: ${{ inputs.candidate-tag }}
          DEV_REPOSITORY: ${{ inputs.image-dev-repository }}
          PROD_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          crane auth login "${REGISTRY_HOST}" --username "${REGISTRY_USERNAME}" --password "${REGISTRY_PASSWORD}"

          DEV_IMAGE="${REGISTRY_HOST}/${DEV_REPOSITORY}"
          PROD_IMAGE="${REGISTRY_HOST}/${PROD_REPOSITORY}"
          SOURCE=""

          if [[ -n "${CANDIDATE_TAG}" ]] && crane manifest "${DEV_IMAGE}:${CANDIDATE_TAG}" >/dev/null 2>&1; then
            SOURCE="${DEV_IMAGE}:${CANDIDATE_TAG}"
          else
            RC_TAG="$(crane ls "${DEV_IMAGE}" 2>/dev/null | grep -E "^${TAG//./\\.}-" | sort -V | tail -n1 || true)"
            if [[ -n "${RC_TAG}" ]] && crane manifest "${DEV_IMAGE}:${RC_TAG}" >/dev/null 2>&1; then
              SOURCE="${DEV_IMAGE}:${RC_TAG}"
            elif crane manifest "${DEV_IMAGE}:${TAG}" >/dev/null 2>&1; then
              SOURCE="${DEV_IMAGE}:${TAG}"
            fi
          fi

          if [[ -z "${SOURCE}" ]]; then
            echo "::error title=Image promote::No candidate image found in ${DEV_IMAGE} for ${TAG}."
            exit 1
          fi

          echo "📦 Promoting ${SOURCE} to ${PROD_IMAGE}:${TAG}"
          crane mutate "${SOURCE}" --label "org.opencontainers.image.version=${TAG}" --tag "${PROD_IMAGE}:${TAG}"
          crane tag "${PROD_IMAGE}:${TAG}" latest
          MAJOR="$(grep -Eo '^[0-9]+' <<<"${TAG}" || true)"
          MINOR="$(grep -Eo '^[0-9]+\.[0-9]+' <<<"${TAG}" || true)"
          [[ -n "${MAJOR}" ]] && crane tag "${PROD_IMAGE}:${TAG}" "${MAJOR}"
          [[ -n "${MINOR}" ]] && crane tag "${PROD_IMAGE}:${TAG}" "${MINOR}"

          {
            echo "### 🐳 Container Image"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Promoted from** | \`${SOURCE}\` |"
            echo "| **Released as** | \`${PROD_IMAGE}:${TAG}\` |"
            echo "| **Digest** | \`$(crane digest "${PROD_IMAGE}:${TAG}")\` |"
            echo ""
          } > "${IMAGE_INFO_FILE_NAME}"
          cat "${IMAGE_INFO_FILE_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Image Info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-info
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/IMAGE_INFO.md
          if-no-files-found: ignore
          retention-days: 7
