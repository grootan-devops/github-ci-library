name: Version · Library
run-name: "Version · ${{ github.ref_name }} · #${{ github.run_number }}"

# Resolves the version the library would release; the one place VERSION is validated.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      tag:
        description: "Semantic version read from VERSION"
        value: ${{ jobs.version.outputs.tag }}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    outputs:
      tag: ${{ steps.read.outputs.TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read VERSION
        id: read
        run: |
          set -euo pipefail
          if [[ ! -s VERSION ]]; then
            echo "::error title=Version::VERSION file is missing or empty."
            # shellcheck disable=SC2016 # backticks are markdown, not command substitution
            printf '### 🏷️ Library version\n\n❌ `VERSION` is missing or empty, so nothing downstream has a tag to work with. It must hold a bare semantic version, e.g. `2.4.0`.\n\n' >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          TAG="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::'${TAG}' is not a semantic version."
            {
              echo "### 🏷️ Library version"
              echo ""
              echo "❌ \`VERSION\` holds \`${TAG}\`, which is not \`MAJOR.MINOR.PATCH\`. The release guards and the git tag both derive from it, so the run stops here."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo "### 🏷️ Library version"
            echo ""
            echo "Releasing as \`${TAG}\` on merge."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
