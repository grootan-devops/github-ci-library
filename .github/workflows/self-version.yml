name: Version · Library

# Resolves the version the library would release. Shared by every other
# dimension so the VERSION contract is validated in exactly one place.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      tag:
        description: "Semantic version read from VERSION"
        value: ${{ jobs.version.outputs.tag }}

permissions:
  contents: read

jobs:
  version:
    name: "Version: Resolve"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    outputs:
      tag: ${{ steps.read.outputs.TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read VERSION
        id: read
        run: |
          set -euo pipefail
          if [[ ! -s VERSION ]]; then
            echo "::error title=Version::VERSION file is missing or empty."
            exit 1
          fi
          TAG="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::'${TAG}' is not a semantic version."
            exit 1
          fi
          echo "TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo "### 🏷️ Library version"
            echo ""
            echo "Releasing as \`${TAG}\` on merge."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
