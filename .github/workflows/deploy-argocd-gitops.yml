name: Deploy / GitOps ArgoCD Synchronization

on:
  workflow_call:
    inputs:
      argocd-version:
        required: false
        type: string
        default: "v3.2.6"
        description: "ArgoCD CLI version to download."
      environment:
        required: true
        type: string
        description: "Target environment (e.g. dev, staging, production)."
      chart-name:
        required: false
        type: string
        default: ""
        description: "Helm chart name, matching .name in Chart.yaml."
      chart-version:
        required: false
        type: string
        default: ""
        description: "Helm chart version to act on."
      chart-repository:
        required: false
        type: string
        default: ""
        description: "Base Helm chart repository path. Charts are always read from <chart-repository>/dev."
      image-repository:
        required: false
        type: string
        default: ""
        description: "Base container image repository path. Images are always read from <image-repository>/dev."
      dev-repository-suffix:
        required: false
        type: string
        default: "/dev"
        description: "Appended verbatim to a repository path for development artifacts, e.g. \"/dev\" gives <repository>/dev. Set to \"\" to publish candidates and releases to the same repository."
      gitops-repo:
        required: true
        type: string
        description: "GitOps repository holding the environment values (e.g. <org>/<repo>-gitops)"
      gitops-branch:
        required: true
        type: string
        description: "GitOps branch to commit to."
      chart-values-file:
        required: false
        type: string
        default: ""
        description: "Relative path to values.yaml in GitOps repository (for Helm deployment)"
      chart-app-yq-path:
        required: false
        type: string
        default: ""
        description: "yq path to the application entry inside values.yaml (e.g. .apps.chat)"
      app-path:
        required: false
        type: string
        default: ""
        description: "Legacy alias for chart-app-yq-path"
      image-values-file:
        required: false
        type: string
        default: ""
        description: "Optional separate image values.yaml path"
      image-repo-yq-path:
        required: false
        type: string
        default: ""
        description: "Optional yq path to update image repository"
      image-tag-yq-path:
        required: false
        type: string
        default: ""
        description: "Optional yq path to update image tag"
      manifest-file:
        required: false
        type: string
        default: ""
        description: "Path to Kubernetes YAML manifest file (for Manifest deployment)"
      new-image:
        required: false
        type: string
        default: ""
        description: "Explicit new image string to set in Kubernetes manifest (required for Manifest deployment)"
      argocd-app-name:
        required: true
        type: string
        description: "Space-separated ArgoCD application names"
      argocd-server:
        required: false
        type: string
        default: ""
        description: "ArgoCD API server hostname, without the scheme (defaults to vars.ARGOCD_SERVER)."
      github-environment-name:
        required: false
        type: string
        default: ""
        description: "Name of the GitHub Deployment environment (e.g. 'production', 'staging', 'dev'). When set, registers a GitHub Deployment."
      github-environment-url:
        required: false
        type: string
        default: ""
        description: "Live URL of the deployed application (e.g. 'https://myapp.example.com')."

    secrets:
      IMAGE_REGISTRY_USERNAME:
        required: false
        description: "Registry username used to verify the chart and image."
      IMAGE_REGISTRY_PASSWORD:
        required: false
        description: "Registry password or token used to verify the chart and image."
      ARGOCD_AUTH_TOKEN:
        required: false
        description: "ArgoCD API token used to sync the application (defaults to secrets.ARGOCD_AUTH_TOKEN)."
      GITOPS_TOKEN:
        required: false
        description: "Token for the GitOps repository. Falls back to GITHUB_TOKEN."

env:
  REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
  REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
  CHART_NAME: ${{ inputs.chart-name }}
  CHART_VERSION: ${{ inputs.chart-version }}
  CHART_REPOSITORY: ${{ inputs.chart-repository }}
  IMAGE_REPOSITORY: ${{ inputs.image-repository }}
  ENVIRONMENT: ${{ inputs.environment }}
  GITOPS_REPO: ${{ inputs.gitops-repo }}
  GITOPS_BRANCH: ${{ inputs.gitops-branch }}
  CHART_VALUES_FILE: ${{ inputs.chart-values-file }}
  CHART_APP_YQ_PATH: ${{ inputs.chart-app-yq-path || inputs.app-path }}
  IMAGE_VALUES_FILE: ${{ inputs.image-values-file }}
  IMAGE_REPO_YQ_PATH: ${{ inputs.image-repo-yq-path }}
  IMAGE_TAG_YQ_PATH: ${{ inputs.image-tag-yq-path }}
  MANIFEST_FILE: ${{ inputs.manifest-file }}
  NEW_IMAGE_INPUT: ${{ inputs.new-image }}
  ARGOCD_SERVER: ${{ inputs.argocd-server || vars.ARGOCD_SERVER || '' }}
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN || '' }}
  ARGOCD_APP_NAME: ${{ inputs.argocd-app-name }}
  DEV_SUFFIX: ${{ inputs.dev-repository-suffix }}

jobs:
  validate:
    name: Validate Deployment Prerequisites
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    outputs:
      gitops-branch: ${{ steps.resolve.outputs.gitops_branch }}
      target-version: ${{ steps.resolve.outputs.target_version }}
      chart-repo-url: ${{ steps.resolve.outputs.chart_repo_url }}
      new-image: ${{ steps.resolve.outputs.new_image }}
      mode: ${{ steps.resolve.outputs.mode }}
      chart-values-file: ${{ steps.resolve.outputs.chart_values_file }}
      chart-app-yq-path: ${{ steps.resolve.outputs.chart_app_yq_path }}
      manifest-file: ${{ steps.resolve.outputs.manifest_file }}

    steps:
      - name: Resolve Deployment Target
        id: resolve
        run: |
          set -euo pipefail

          MISSING=()
          [[ -z "${ARGOCD_APP_NAME}" ]] && MISSING+=("argocd-app-name")
          [[ -z "${ARGOCD_SERVER}" ]] && MISSING+=("argocd-server (or vars.ARGOCD_SERVER)")
          [[ -z "${ARGOCD_AUTH_TOKEN}" ]] && MISSING+=("ARGOCD_AUTH_TOKEN secret")
          [[ -z "${GITOPS_REPO}" ]] && MISSING+=("gitops-repo")
          [[ -z "${GITOPS_BRANCH}" ]] && MISSING+=("gitops-branch")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::[HARD FAILURE] Missing mandatory deployment configuration: ${MISSING[*]}"
            exit 1
          fi

          RESOLVED_CHART_APP_YQ_PATH="${CHART_APP_YQ_PATH:-${APP_PATH:-}}"
          MODE=""
          if [[ -n "${CHART_VALUES_FILE}" || -n "${RESOLVED_CHART_APP_YQ_PATH}" ]]; then
            MODE="helm"
          fi
          if [[ -n "${MANIFEST_FILE}" ]]; then
            if [[ -n "${MODE}" ]]; then
              echo "::error::[HARD FAILURE] Both Helm parameters (chart-values-file/chart-app-yq-path) and Manifest parameters (manifest-file) are configured. Choose either Helm or Manifest deployment."
              exit 1
            fi
            MODE="manifest"
          fi

          if [[ -z "${MODE}" ]]; then
            echo "::error::[HARD FAILURE] Either chart-values-file (for Helm) or manifest-file (for Manifest) must be configured."
            exit 1
          fi

          if [[ "${MODE}" == "helm" ]]; then
            if [[ -z "${RESOLVED_CHART_APP_YQ_PATH}" ]]; then
              echo "::error::[HARD FAILURE] chart-app-yq-path (or app-path) is mandatory when chart-values-file is specified."
              exit 1
            fi
            if [[ -n "${IMAGE_VALUES_FILE}" ]]; then
              HELM_IMG_MISSING=()
              [[ -z "${IMAGE_REPO_YQ_PATH}" ]] && HELM_IMG_MISSING+=("image-repo-yq-path")
              [[ -z "${IMAGE_TAG_YQ_PATH}" ]] && HELM_IMG_MISSING+=("image-tag-yq-path")
              if [[ ${#HELM_IMG_MISSING[@]} -gt 0 ]]; then
                echo "::error::[HARD FAILURE] When image-values-file is used with chart-values-file, the following are mandatory: ${HELM_IMG_MISSING[*]}"
                exit 1
              fi
            fi
          elif [[ "${MODE}" == "manifest" ]]; then
            if [[ -z "${NEW_IMAGE_INPUT}" ]]; then
              echo "::error::[HARD FAILURE] new-image is mandatory when manifest-file is specified."
              exit 1
            fi
          fi

          TARGET_VERSION="${CHART_VERSION}"
          CHART_REPO_URL="${REGISTRY_HOST}/${CHART_REPOSITORY}${DEV_SUFFIX}"
          NEW_IMAGE="${NEW_IMAGE_INPUT:-${REGISTRY_HOST}/${IMAGE_REPOSITORY}${DEV_SUFFIX}:${TARGET_VERSION}}"

          {
            echo "gitops_branch=${GITOPS_BRANCH}"
            echo "target_version=${TARGET_VERSION}"
            echo "chart_repo_url=${CHART_REPO_URL}"
            echo "new_image=${NEW_IMAGE}"
            echo "mode=${MODE}"
            echo "chart_values_file=${CHART_VALUES_FILE:-values.yaml}"
            echo "chart_app_yq_path=${RESOLVED_CHART_APP_YQ_PATH}"
            echo "manifest_file=${MANIFEST_FILE}"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Validate Chart Exists In Registry
        if: ${{ steps.resolve.outputs.mode == 'helm' && inputs.chart-name != '' && inputs.chart-version != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_USERNAME}" || -z "${REGISTRY_PASSWORD}" ]]; then
            echo "::error::REGISTRY_USERNAME / REGISTRY_PASSWORD are required to verify the chart before deploying."
            exit 1
          fi
          printf '%s' "${REGISTRY_PASSWORD}" | helm registry login "${REGISTRY_HOST}" --username "${REGISTRY_USERNAME}" --password-stdin

          TARGET="oci://${{ steps.resolve.outputs.chart_repo_url }}/${CHART_NAME}"
          if ! helm show chart "${TARGET}" --version "${{ steps.resolve.outputs.target_version }}" >/dev/null 2>&1; then
            echo "::error::Helm chart '${CHART_NAME}' version '${{ steps.resolve.outputs.target_version }}' does not exist at ${TARGET}. Refusing to commit a GitOps change that cannot resolve."
            exit 1
          fi
          echo "Chart ${CHART_NAME}:${{ steps.resolve.outputs.target_version }} verified at ${TARGET}."

      - name: Validate Image Exists In Registry
        if: steps.resolve.outputs.new_image != '' && env.REGISTRY_USERNAME != '' && env.REGISTRY_PASSWORD != ''
        env:
          REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          crane auth login "${REGISTRY_HOST}" --username "${REGISTRY_USERNAME}" --password "${REGISTRY_PASSWORD}"
          TARGET="${{ steps.resolve.outputs.new_image }}"
          if ! crane manifest "${TARGET}" >/dev/null 2>&1; then
            echo "::error::Container image '${TARGET}' does not exist. Refusing to commit a GitOps change that cannot resolve."
            exit 1
          fi
          echo "Image ${TARGET} verified."

      - name: Publish Validation Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ steps.resolve.outputs.target_version }}
          MODE: ${{ steps.resolve.outputs.mode }}
        run: |
          set -euo pipefail
          {
            echo "### 🔎 Deployment prerequisites"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ \`${VERSION}\` verified in the registry — ready to deploy to **${ENVIRONMENT}** (${MODE} mode)."
            else
              echo "❌ Refused to commit a GitOps change that cannot resolve. Check that \`${VERSION}\` was published."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  gitops-commit:
    name: Update GitOps Repository
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    timeout-minutes: 10
    needs: validate
    environment:
      name: ${{ inputs.github-environment-name }}
      url: ${{ inputs.github-environment-url }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    outputs:
      commit-sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.gitops-repo }}
          ref: ${{ needs.validate.outputs.gitops-branch }}
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
          path: gitops

      - name: Update Version / Manifest Configurations
        id: update
        working-directory: gitops
        run: |
          set -euo pipefail

          MODE="${{ needs.validate.outputs.mode }}"
          if [[ "${MODE}" == "manifest" ]]; then
            MANIFEST_PATH="${{ needs.validate.outputs.manifest-file }}"
            NEW_IMG="${{ needs.validate.outputs.new-image }}"
            echo "Updating manifest ${MANIFEST_PATH} -> image = ${NEW_IMG}..."
            if [[ ! -f "${MANIFEST_PATH}" ]]; then
              echo "::error::Manifest file not found: ${MANIFEST_PATH}"
              exit 1
            fi
            yq eval '(.spec.template.spec.containers[0].image // .spec.containers[0].image) = "'"${NEW_IMG}"'"' -i "${MANIFEST_PATH}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "commit_msg=chore(deploy): update ${MANIFEST_PATH} image to ${NEW_IMG} [skip ci]" >> "${GITHUB_OUTPUT}"
          else
            VALUES_PATH="${{ needs.validate.outputs.chart-values-file }}"
            APP_PATH="${{ needs.validate.outputs.chart-app-yq-path }}"
            TARGET_VERSION="${{ needs.validate.outputs.target-version }}"
            CHART_REPO_URL="${{ needs.validate.outputs.chart-repo-url }}"
            IMAGE_VALUES_FILE="${{ inputs.image-values-file }}"
            IMAGE_REPO_YQ_PATH="${{ inputs.image-repo-yq-path }}"
            IMAGE_TAG_YQ_PATH="${{ inputs.image-tag-yq-path }}"

            if [[ ! -f "${VALUES_PATH}" ]]; then
              echo "::error::Values file not found: ${VALUES_PATH}"
              exit 1
            fi

            echo "Updating ${CHART_NAME:-chart} (${APP_PATH}) to ${TARGET_VERSION} in ${VALUES_PATH}..."
            if [[ -n "${CHART_REPO_URL}" ]]; then
              yq eval "${APP_PATH}.chart.repoURL = \"${CHART_REPO_URL}\"" -i "${VALUES_PATH}"
            fi
            yq eval "${APP_PATH}.chart.version = \"${TARGET_VERSION}\"" -i "${VALUES_PATH}"

            if [[ -n "${IMAGE_VALUES_FILE}" ]]; then
              if [[ ! -f "${IMAGE_VALUES_FILE}" ]]; then
                echo "::error::Image values file not found: ${IMAGE_VALUES_FILE}"
                exit 1
              fi
              echo "Updating image repo (${IMAGE_REPO_YQ_PATH}) and tag (${IMAGE_TAG_YQ_PATH}) in ${IMAGE_VALUES_FILE}..."
              yq eval "${IMAGE_REPO_YQ_PATH} = \"${CHART_REPO_URL}\"" -i "${IMAGE_VALUES_FILE}"
              yq eval "${IMAGE_TAG_YQ_PATH} = \"${TARGET_VERSION}\"" -i "${IMAGE_VALUES_FILE}"
            fi
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "commit_msg=chore(deploy): update ${CHART_NAME:-workload} to ${TARGET_VERSION} [skip ci]" >> "${GITHUB_OUTPUT}"
          fi

          git --no-pager diff

      - name: Commit and Push Changes
        id: commit
        if: steps.update.outputs.skip != 'true'
        working-directory: gitops
        env:
          GITOPS_BRANCH: ${{ needs.validate.outputs.gitops-branch }}
          RAW_COMMIT_MSG: ${{ steps.update.outputs.commit_msg }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COMMIT_MSG="${RAW_COMMIT_MSG}

          Environment: ${ENVIRONMENT}
          Triggered by: ${GITHUB_ACTOR}
          Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git add .
          if git diff --cached --quiet; then
            echo "No staged changes. Nothing to commit."
            echo "sha=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "${COMMIT_MSG}"

          git push origin "HEAD:${GITOPS_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish GitOps Commit Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          SHA: ${{ steps.commit.outputs.sha }}
          GITOPS_REPO: ${{ inputs.gitops-repo }}
          BRANCH: ${{ needs.validate.outputs.gitops-branch }}
          VERSION: ${{ needs.validate.outputs.target-version }}
        run: |
          set -euo pipefail
          {
            echo "### 🚢 GitOps commit"
            echo ""
            if [[ "${OUTCOME}" != "success" ]]; then
              echo "❌ Failed to update \`${GITOPS_REPO}\`. See the job log."
            elif [[ -z "${SHA}" ]]; then
              echo "ℹ️ No change required — \`${GITOPS_REPO}\` already targets \`${VERSION}\`."
            else
              echo "| Property | Value |"
              echo "|---|---|"
              echo "| **Repository** | \`${GITOPS_REPO}\` |"
              echo "| **Branch** | \`${BRANCH}\` |"
              echo "| **Commit** | \`${SHA}\` |"
              echo "| **Version** | \`${VERSION}\` |"
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  argocd-sync:
    name: Sync ArgoCD Application
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [validate, gitops-commit]
    defaults:
      run:
        shell: bash
    env:
      ARGOCD_OPTS: "--grpc-web"
      ARGOCD_VERSION: ${{ inputs.argocd-version }}
      ARGOCD_SERVER: ${{ inputs.argocd-server || vars.ARGOCD_SERVER || '' }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN || '' }}
      SYNC_TIMEOUT: 600

    steps:
      - name: Cache ArgoCD CLI
        id: cache-argocd
        uses: actions/cache/restore@v6
        with:
          path: /usr/local/bin/argocd
          key: argocd-cli-${{ env.ARGOCD_VERSION }}

      - name: Install ArgoCD CLI
        if: ${{ steps.cache-argocd.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          BASE="https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}"
          cd "${RUNNER_TEMP}"
          curl -fsSL -o argocd-linux-amd64 "${BASE}/argocd-linux-amd64"
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          cd - >/dev/null
          argocd version --client

      - name: Sync and Wait for Health
        id: sync
        env:
          EXPECTED_REVISION: ${{ needs.gitops-commit.outputs.commit-sha }}
        run: |
          set -uo pipefail

          if [[ -z "${ARGOCD_AUTH_TOKEN}" ]]; then
            echo "::error::ARGOCD_AUTH_TOKEN is not configured. Refusing to report a successful deployment without performing one."
            exit 1
          fi

          OVERALL_HEALTH="Healthy"
          OVERALL_SYNC="Synced"
          FAILED_APPS=()

          APP_ROWS="${RUNNER_TEMP}/argocd-apps.tsv"
          : > "${APP_ROWS}"

          for APP in ${ARGOCD_APP_NAME}; do
            echo "=== ${APP} ==="

            argocd app get "${APP}" --hard-refresh || true

            SYNC_OK=true
            if ! argocd app sync "${APP}" --async; then
              echo "::error::Sync request failed for ${APP}."
              SYNC_OK=false
            fi

            if [[ "${SYNC_OK}" == "true" ]]; then
              if ! argocd app wait "${APP}" --health --sync --operation \
                   --timeout "${SYNC_TIMEOUT}"; then
                SYNC_OK=false
              fi
            fi

            if [[ "${SYNC_OK}" != "true" ]]; then
              FAILED_APPS+=("${APP}")
              OVERALL_HEALTH="Unhealthy"
              OVERALL_SYNC="OutOfSync"
            fi

            APP_JSON="$(argocd app get "${APP}" -o json 2>/dev/null || true)"
            if [[ -n "${APP_JSON}" ]]; then
              APP_SYNC="$(jq -r '.status.sync.status // "Unknown"' <<<"${APP_JSON}")"
              APP_HEALTH="$(jq -r '.status.health.status // "Unknown"' <<<"${APP_JSON}")"
              APP_REV="$(jq -r '.status.sync.revision // "" | .[0:7]' <<<"${APP_JSON}")"
              APP_MSG="$(jq -r '.status.operationState.message // "" | gsub("\n"; " ") | .[0:120]' <<<"${APP_JSON}")"

              FULL_REV="$(jq -r '.status.sync.revision // ""' <<<"${APP_JSON}")"
              if [[ "${SYNC_OK}" == "true" && -n "${EXPECTED_REVISION}" && -n "${FULL_REV}" && "${FULL_REV}" != "${EXPECTED_REVISION}" ]]; then
                echo "::error::${APP} is synced to ${FULL_REV:0:7}, not the revision this run pushed (${EXPECTED_REVISION:0:7})."
                FAILED_APPS+=("${APP}")
                OVERALL_SYNC="OutOfSync"
                APP_MSG="synced to ${FULL_REV:0:7}, expected ${EXPECTED_REVISION:0:7}"
              fi
            else
              APP_SYNC="Unknown"; APP_HEALTH="Unknown"; APP_REV=""; APP_MSG="could not read application state"
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "${APP}" "${APP_SYNC}" "${APP_HEALTH}" "${APP_REV}" "${APP_MSG}" >> "${APP_ROWS}"
          done

          {
            echo "health=${OVERALL_HEALTH}"
            echo "sync=${OVERALL_SYNC}"
          } >> "${GITHUB_OUTPUT}"

          if [[ ${#FAILED_APPS[@]} -gt 0 ]]; then
            echo "::error::ArgoCD sync or health check failed for: ${FAILED_APPS[*]}"
            exit 1
          fi
          echo "All applications are Synced and Healthy."

      - name: Publish Deployment Summary
        if: always()
        run: |
          {
            echo "## 🚢 Deployment Summary"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Environment** | \`${ENVIRONMENT}\` |"
            echo "| **Applications** | \`${ARGOCD_APP_NAME}\` |"
            echo "| **Chart Version** | \`${{ needs.validate.outputs.target-version || 'n/a' }}\` |"
            echo "| **Chart repoURL** | \`${{ needs.validate.outputs.chart-repo-url || 'n/a' }}\` |"
            echo "| **Image** | \`${{ needs.validate.outputs.new-image || 'n/a' }}\` |"
            echo "| **GitOps Branch** | \`${{ needs.validate.outputs.gitops-branch }}\` |"
            echo "| **GitOps Commit** | \`${{ needs.gitops-commit.outputs.commit-sha || 'no change' }}\` |"
            echo "| **Sync Status** | ${{ steps.sync.outputs.sync || 'n/a' }} |"
            echo "| **Health Status** | ${{ steps.sync.outputs.health || 'n/a' }} |"
            if [[ -n "${{ inputs.github-environment-url }}" ]]; then
              echo "| **Live URL** | [${{ inputs.github-environment-url }}](${{ inputs.github-environment-url }}) |"
            fi

            APP_ROWS="${RUNNER_TEMP}/argocd-apps.tsv"
            if [[ -s "${APP_ROWS}" ]]; then
              echo ""
              echo "### 📦 Applications"
              echo ""
              echo "| Application | Sync | Health | Revision | Message |"
              echo "|---|:--:|:--:|---|---|"
              while IFS=$'\t' read -r APP APP_SYNC APP_HEALTH APP_REV APP_MSG; do
                [[ -z "${APP}" ]] && continue
                case "${APP_SYNC}" in   Synced)  SYNC_ICON="✅ Synced" ;;   *) SYNC_ICON="❌ ${APP_SYNC}" ;; esac
                case "${APP_HEALTH}" in Healthy) HEALTH_ICON="✅ Healthy" ;; *) HEALTH_ICON="❌ ${APP_HEALTH}" ;; esac
                echo "| \`${APP}\` | ${SYNC_ICON} | ${HEALTH_ICON} | \`${APP_REV:-n/a}\` | ${APP_MSG:-—} |"
              done < "${APP_ROWS}"
            fi

          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save ArgoCD CLI Cache
        if: ${{ !cancelled() && steps.cache-argocd.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /usr/local/bin/argocd
          key: argocd-cli-${{ env.ARGOCD_VERSION }}
