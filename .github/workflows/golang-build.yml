name: Go / Dependency, Build & Test

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: "."
        description: "Path to the Go module root. Monorepo children set this."
      build-command:
        required: false
        type: string
        default: "go build -trimpath -o bin/ ./..."
        description: "Build command."
      test-command:
        required: false
        type: string
        default: "go test ./... -v 2>&1 | go-junit-report -set-exit-code > test-report/junit.xml"
        description: "Unit test command. Must write JUnit XML into test-report/."
      run-tests:
        required: false
        type: boolean
        default: true
        description: "Run the unit test job."
      build-env:
        required: false
        type: string
        default: ""
        description: "Newline-separated KEY=VALUE pairs exported into build and test."

env:
  PROJECT_PATH: ${{ inputs.project-path }}
  TEST_REPORT_DIR: test-report
  GOPATH: ${{ github.workspace }}/.go-cache
  GOFLAGS: -mod=readonly

permissions:
  contents: read

jobs:
  dependency:
    name: Dependency Download
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: grootantech/toolkit:1.0.0
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Compute Module Cache Key
        id: key
        run: echo "key=go-${{ hashFiles(format('{0}/go.sum', inputs.project-path)) || 'nolock' }}" >> "${GITHUB_OUTPUT}"

      - name: Restore Module Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .go-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: go-

      - name: Download Modules
        id: download
        run: |
          set -uo pipefail
          go mod download 2>&1 | tee "${RUNNER_TEMP}/go-mod-download.log"
          exit "${PIPESTATUS[0]}"

      - name: Save Module Cache
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@v6
        with:
          path: .go-cache
          key: ${{ steps.key.outputs.key }}

      - name: Publish Dependency Summary
        if: always()
        env:
          STACK_LABEL: "🐹 Go modules"
          OUTCOME: ${{ steps.download.outcome }}
          CACHE_KEY: ${{ steps.key.outputs.key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          SUCCESS_MESSAGE: "Modules resolved."
          RESOLVE_COMMAND: "go mod download"
          TOOL_LABEL: "Go"
          LOG_FILE: "go-mod-download.log"
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/build/dependency-summary.sh"

  build:
    name: Build
    needs: dependency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: grootantech/toolkit:1.0.0
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Export Build Environment
        if: ${{ inputs.build-env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/build/export-env.sh"

      - name: Restore Module Cache
        uses: actions/cache/restore@v6
        with:
          path: .go-cache
          key: ${{ needs.dependency.outputs.cache-key }}
          restore-keys: go-

      - name: Build
        id: compile
        run: |
          set -uo pipefail
          # Braces, not a bare pipe: a command ending in its own redirect would leave tee empty.
          { ${{ inputs.build-command }} ; } 2>&1 | tee "${RUNNER_TEMP}/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload Binaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: ${{ inputs.project-path }}/bin/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Publish Build Summary
        if: always()
        env:
          STACK_LABEL: "Go"
          TOOL_LABEL: "The compiler"
          BUILD_COMMAND: ${{ inputs.build-command }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          ARTIFACT_NAME: "go-binaries"
          ARTIFACT_DIR: "bin"
          ARTIFACT_GLOB: "bin/*"
          ARTIFACT_COLUMN: "Binary"
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/build/summary.sh"

  test:
    name: Unit Test
    if: ${{ inputs.run-tests }}
    needs: dependency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    container:
      image: grootantech/toolkit:1.0.0
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Export Test Environment
        if: ${{ inputs.build-env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/build/export-env.sh"

      - name: Restore Module Cache
        uses: actions/cache/restore@v6
        with:
          path: .go-cache
          key: ${{ needs.dependency.outputs.cache-key }}
          restore-keys: go-

      - name: Run Unit Tests
        id: unit
        run: |
          set -uo pipefail
          mkdir -p "${TEST_REPORT_DIR}"
          # Braces, not a bare pipe: a command ending in its own redirect would leave tee empty.
          { ${{ inputs.test-command }} ; } 2>&1 | tee "${RUNNER_TEMP}/test.log"
          exit "${PIPESTATUS[0]}"

      # junit-report.sh has nothing to show when the runner never wrote a JUnit file.
      - name: Explain Test Runner Failure
        if: ${{ failure() && steps.unit.outcome == 'failure' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          {
            echo "### 🧪 Go test command"
            echo ""
            echo "❌ \`${TEST_COMMAND}\` exited non-zero. It reported:"
            echo ""
            echo '```'
            tail -n 50 "${RUNNER_TEMP}/test.log" 2>/dev/null || echo "(no output was captured)"
            echo '```'
            echo ""
            echo "Per-case results, where the run got far enough to produce any, are in the table below and in the \`go-test-reports\` artifact."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-reports
          path: ${{ inputs.project-path }}/test-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Test Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NAME: "Go Unit Test Results"
          REPORT_GLOB: "${{ inputs.project-path }}/test-report/**/*.xml"
          JOB_SUMMARY: "true"
          FAIL_ON_FAILURE: "true"
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/build/junit-report.sh"
