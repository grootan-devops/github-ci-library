name: Security / Secret Scanning

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: "."
        description: "Project root. Monorepo children set this."
      full-history:
        required: false
        type: boolean
        default: false
        description: "Scan the entire history even on a pull request."

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: grootantech/toolkit:1.1.0
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Scan Git History For Secrets
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/scan/secret-history.sh"

      - name: Publish Secret Scan Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/scan/secret-summary.sh"
