name: Security / Secret Scanning

# Counterpart of the GitLab Git:Secret:Scan job. On a pull request only the
# range introduced by the branch is scanned; everywhere else the full history is.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."
      full-history:
        required: false
        type: boolean
        default: false
        description: "Scan the entire history even on a pull request."

jobs:
  secret-scan:
    name: "Security: Secret Scan"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git History For Secrets
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # actions/checkout marks the workspace safe only for the duration of
          # its own step, so git inside this step still refuses the checkout as
          # dubiously owned and betterleaks scans zero bytes. betterleaks shells
          # out to git without inheriting a per-user config reliably, so pass the
          # exception through the environment, which every child git does honour.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="${GITHUB_WORKSPACE}"
          git config --system --add safe.directory "${GITHUB_WORKSPACE}" 2>/dev/null || true
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true

          RANGE_ARGS=()

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${FULL_HISTORY}" != "true" && -n "${BASE_SHA}" ]]; then
            echo "Scanning pull request range ${BASE_SHA}..HEAD"
            RANGE_ARGS=(--log-opts "${BASE_SHA}..HEAD")
          else
            echo "Scanning full history"
          fi

          betterleaks git . "${RANGE_ARGS[@]}" \
            --redact --verbose --no-banner --no-color --ignore-gitleaks-allow

      - name: Publish Secret Scan Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### 🔐 Secret scan"
            echo ""
            case "${OUTCOME}" in
              success) echo "✅ No secrets detected." ;;
              failure) echo "❌ Potential secrets detected. Findings are redacted in the job log — rotate anything real before removing it from history." ;;
              *)       echo "Status: ${OUTCOME}" ;;
            esac
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
