name: Security / Secret Scanning

# Counterpart of the GitLab Git:Secret:Scan job. On a pull request only the
# range introduced by the branch is scanned; everywhere else the full history is.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."
      full-history:
        required: false
        type: boolean
        default: false
        description: "Scan the entire history even on a pull request."

jobs:
  secret-scan:
    name: "Security: Secret Scan"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git History For Secrets
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # actions/checkout marks the workspace safe only for the duration of
          # its own step, so git inside this step still refuses the checkout as
          # dubiously owned and betterleaks scans zero bytes. betterleaks shells
          # out to git without inheriting a per-user config reliably, so pass the
          # exception through the environment, which every child git does honour.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="${GITHUB_WORKSPACE}"
          git config --system --add safe.directory "${GITHUB_WORKSPACE}" 2>/dev/null || true
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true

          # A pull request scans only the commits it introduces, but only when
          # both ends of that range are genuinely present in this checkout.
          # Anything else falls back to the full history: a range that cannot be
          # resolved must never silently degrade into a scan of nothing.
          RANGE_ARGS=()
          SCAN_SCOPE="full history"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${FULL_HISTORY}" != "true" ]]; then
            if [[ -z "${BASE_SHA}" ]]; then
              echo "::warning title=Secret scan::No pull request base commit available. Scanning the full history instead."
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning title=Secret scan::Base commit ${BASE_SHA} is not in this checkout. Scanning the full history instead."
            elif ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
              echo "::warning title=Secret scan::Head commit ${HEAD_SHA} is not in this checkout. Scanning the full history instead."
            elif [[ -z "$(git rev-list "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null)" ]]; then
              echo "::warning title=Secret scan::Range ${BASE_SHA}..${HEAD_SHA} resolves to no commits. Scanning the full history instead."
            else
              SCAN_SCOPE="pull request range ${BASE_SHA}..${HEAD_SHA}"
              RANGE_ARGS=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
            fi
          fi

          echo "Scanning ${SCAN_SCOPE}"
          echo "SCAN_SCOPE=${SCAN_SCOPE}" >> "${GITHUB_ENV}"

          # --platform is what turns each finding's commit into a clickable
          # link in the report. GitLab's Git:Secret:Scan passes `gitlab`; left
          # unset the findings carry bare SHAs and reviewers have to go looking
          # for the commit by hand.
          betterleaks git . "${RANGE_ARGS[@]}" \
            --redact --verbose --no-banner --no-color --platform github --ignore-gitleaks-allow

      - name: Publish Secret Scan Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### 🔐 Secret scan"
            echo ""
            case "${OUTCOME}" in
              success) echo "✅ No secrets detected across the ${SCAN_SCOPE:-full history}." ;;
              failure) echo "❌ Potential secrets detected. Findings are redacted in the job log — rotate anything real before removing it from history." ;;
              *)       echo "Status: ${OUTCOME}" ;;
            esac
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
