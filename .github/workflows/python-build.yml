name: Python / Dependency, Build & Test

# Counterpart of the GitLab Python module: Python:Dependency:Download ->
# Python:Build + Python:Test:Unit. Dependencies resolve once and are shared;
# build and test then run in parallel, both hard-dependent on that resolution so
# a dependency failure costs one job instead of three.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Path to the Python project root. Monorepo children set this."
      build-command:
        required: false
        type: string
        default: "uv build --offline"
        description: "Package build command."
      test-command:
        required: false
        type: string
        default: "uv run pytest --junitxml=test-report/junit.xml --cov --cov-report=xml"
        description: "Unit test command. Must write JUnit XML into test-report/."
      run-tests:
        required: false
        type: boolean
        default: true
        description: "Run the unit test job. Set false for a project with no test suite."
      build-env:
        required: false
        type: string
        default: ""
        description: "Newline-separated KEY=VALUE pairs exported into build and test."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TEST_REPORT_DIR: test-report
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_VENV_RELOCATABLE: "1"

jobs:
  # Warms the dependency cache once. Everything downstream pulls it read-only,
  # exactly as the GitLab `policy: pull-push` / `policy: pull` split does.
  dependency:
    name: Dependency Download
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # hashFiles returns "" when uv.lock is absent, collapsing the key
      # onto the bare `py-` restore-keys prefix — a half-populated environment
      # every later run would then prefix-match, valid uv.lock or not.
      - name: Compute Dependency Cache Key
        id: key
        run: echo "key=py-${{ hashFiles(format('{0}/uv.lock', inputs.project-path || vars.PROJECT_PATH || '.')) || 'nolock' }}" >> "${GITHUB_OUTPUT}"

      - name: Restore uv Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .uv-cache
          key: ${{ steps.key.outputs.key }}
          restore-keys: py-

      - name: Resolve Dependencies
        id: resolve
        run: |
          set -uo pipefail
          # Capture as well as stream: uv names the package and the constraint
          # it could not satisfy, and that sentence is the whole answer. An
          # exit code on its own is not.
          uv sync --frozen --no-install-project --no-install-workspace 2>&1 | tee "${RUNNER_TEMP}/uv-sync.log"
          exit "${PIPESTATUS[0]}"

      # GitLab inherits `when: always` here, which is safe there because a cache
      # key is rewritable — a partial tree from a failed resolve is overwritten
      # by the next green run. GitHub entries are immutable, so the same write
      # would freeze a half-populated tree under a perfectly valid key until
      # uv.lock changes, and the build and test jobs would keep restoring it.
      - name: Save uv Cache
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .uv-cache
          key: ${{ steps.key.outputs.key }}

      # Cache hit or miss is worth stating on a green run: it is what explains
      # the job's duration, and a key that never hits points at a uv.lock that
      # keeps changing. On a failure uv's own words go here too, since no other
      # job in the graph will report them.
      - name: Publish Dependency Summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.key.outputs.key }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
        run: |
          set -euo pipefail
          CACHE_STATE="rebuilt — no entry matched"
          [[ "${CACHE_HIT}" == "true" ]] && CACHE_STATE="restored"
          {
            echo "### 🐍 Python dependencies"
            echo ""
            if [[ "${RESOLVE_OUTCOME}" == "success" ]]; then
              echo "✅ Environment resolved. Cache \`${CACHE_KEY}\`: ${CACHE_STATE}."
            else
              echo "❌ \`uv sync --frozen\` failed. Cache \`${CACHE_KEY}\`: ${CACHE_STATE}. uv reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/uv-sync.log" 2>/dev/null || echo "(no output was captured)"
              echo '```'
              echo ""
              echo "\`--frozen\` refuses to update \`uv.lock\`, so a drifted lock file has to be regenerated with \`uv lock\` and committed."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build
    needs: dependency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Export Build Environment
        if: ${{ inputs.build-env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          while IFS='=' read -r KEY VAL; do
            KEY="${KEY#"${KEY%%[![:space:]]*}"}"
            KEY="${KEY%"${KEY##*[![:space:]]}"}"
            [[ -z "${KEY}" || "${KEY}" =~ ^# ]] && continue
            printf '%s=%s\n' "${KEY}" "${VAL}" >> "${GITHUB_ENV}"
          done <<< "${BUILD_ENV}"

      - name: Restore uv Cache
        uses: actions/cache/restore@v6
        with:
          path: .uv-cache
          key: ${{ needs.dependency.outputs.cache-key }}
          restore-keys: py-

      - name: Sync Dependencies
        run: uv sync --frozen --no-install-project --no-install-workspace

      - name: Build Package
        id: compile
        run: |
          set -uo pipefail
          # Braces, not a bare pipe: a build command may end in its own
          # redirect, and `cmd > file | tee` would hand tee an empty stream.
          { ${{ inputs.build-command }} ; } 2>&1 | tee "${RUNNER_TEMP}/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload Distribution
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/dist/
          retention-days: 7
          include-hidden-files: true

      - name: Publish Build Summary
        if: always()
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### 📦 Python build"
            echo ""
            if [[ "${COMPILE_OUTCOME}" != "success" ]]; then
              # "No artifacts were produced" is a symptom. The build backend
              # already named the file and the reason, so that is what goes here.
              echo "❌ \`${BUILD_COMMAND}\` failed. It reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/build.log" 2>/dev/null || echo "(no output was captured)"
              echo '```'
            elif [[ -d dist ]]; then
              echo "| Artifact | Size |"
              echo "|---|---|"
              for F in dist/*; do
                [[ -f "${F}" ]] || continue
                echo "| \`$(basename "${F}")\` | $(du -h "${F}" | cut -f1) |"
              done
            else
              echo "⚠️ \`${BUILD_COMMAND}\` succeeded but wrote nothing to \`dist/\`, so the \`python-dist\` artifact will be empty."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Unit Test
    if: ${{ inputs.run-tests }}
    needs: dependency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Export Test Environment
        if: ${{ inputs.build-env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          while IFS='=' read -r KEY VAL; do
            KEY="${KEY#"${KEY%%[![:space:]]*}"}"
            KEY="${KEY%"${KEY##*[![:space:]]}"}"
            [[ -z "${KEY}" || "${KEY}" =~ ^# ]] && continue
            printf '%s=%s\n' "${KEY}" "${VAL}" >> "${GITHUB_ENV}"
          done <<< "${BUILD_ENV}"

      - name: Restore uv Cache
        uses: actions/cache/restore@v6
        with:
          path: .uv-cache
          key: ${{ needs.dependency.outputs.cache-key }}
          restore-keys: py-

      - name: Sync Dependencies
        run: uv sync --frozen --no-install-project --no-install-workspace

      - name: Run Unit Tests
        id: unit
        run: |
          set -uo pipefail
          mkdir -p "${TEST_REPORT_DIR}" coverage
          # Braces, not a bare pipe: a test command may end in its own redirect
          # into the JUnit file, and `cmd > file | tee` would hand tee an empty
          # stream.
          { ${{ inputs.test-command }} ; } 2>&1 | tee "${RUNNER_TEMP}/test.log"
          exit "${PIPESTATUS[0]}"

      # junit-report.sh reports the cases a JUnit file records. A test command
      # that never wrote one — a collection error, a missing plugin — leaves it
      # nothing to report, so its own output has to be what explains the job.
      - name: Explain Test Runner Failure
        if: ${{ failure() && steps.unit.outcome == 'failure' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          {
            echo "### 🧪 Python test command"
            echo ""
            echo "❌ \`${TEST_COMMAND}\` exited non-zero. It reported:"
            echo ""
            echo '```'
            tail -n 50 "${RUNNER_TEMP}/test.log" 2>/dev/null || echo "(no output was captured)"
            echo '```'
            echo ""
            echo "Per-case results, where the run got far enough to produce any, are in the table below and in the \`python-test-reports\` artifact."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Test & Coverage Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-reports
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/test-report/
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/coverage/
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Test Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NAME: "Python Unit Test Results"
          REPORT_GLOB: "${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/test-report/**/*.xml"
          JOB_SUMMARY: "true"
          FAIL_ON_FAILURE: "true"
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/junit-report.sh"
