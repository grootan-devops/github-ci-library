name: Check · Library Release Guards

# The release guards applied to the library itself, callable on its own.
# The library ships no Dockerfile and no chart, so check.yml discovers only the
# git-tag, changelog and migration guards — no image or chart jobs are created.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  check:
    name: Release Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
