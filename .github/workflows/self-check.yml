name: Check · Library Release Guards
run-name: "Check · ${{ github.ref_name }} · #${{ github.run_number }}"

# The release guards applied to the library itself, callable on its own.
# No Dockerfile or chart here, so check.yml creates only the tag/changelog/migration guards.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  check:
    name: Release Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
