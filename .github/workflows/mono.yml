name: Mono / Changed Project Discovery

# Counterpart of the GitLab monorepo parent pipeline (mono/.gitlab-ci.yml and
# common/.mono.gitlab-ci.yml).
#
# GitHub Actions has no child pipelines: a reusable workflow cannot be invoked
# from a matrix. So instead of triggering children, this workflow answers the
# question the parent pipeline existed to answer — which projects changed — and
# returns a matrix the caller fans its own jobs out over.
#
#   discover:
#     uses: <org>/ci-library/.github/workflows/mono.yml@<ref>
#   build:
#     needs: discover
#     if: ${{ needs.discover.outputs.any-changed == 'true' }}
#     strategy:
#       matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
#     uses: <org>/ci-library/.github/workflows/python-build.yml@<ref>
#     with:
#       project-path: ${{ matrix.path }}

on:
  workflow_call:
    inputs:
      projects:
        required: false
        type: string
        default: ""
        description: >-
          JSON array of child projects, e.g.
          [{"name":"api","path":"services/api"},{"name":"web","path":"services/web"}].
          Defaults to vars.MONO_PROJECTS.
      always-run-all:
        required: false
        type: boolean
        default: false
        description: "Return every project regardless of what changed. Release runs should set this."

    outputs:
      matrix:
        description: "strategy.matrix object covering the changed projects"
        value: ${{ jobs.discover.outputs.MATRIX }}
      any-changed:
        description: "true when at least one project changed"
        value: ${{ jobs.discover.outputs.ANY_CHANGED }}
      changed-count:
        description: "Number of projects selected"
        value: ${{ jobs.discover.outputs.CHANGED_COUNT }}

jobs:
  discover:
    name: Discover Changed Projects
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    outputs:
      MATRIX: ${{ steps.discover.outputs.MATRIX }}
      ANY_CHANGED: ${{ steps.discover.outputs.ANY_CHANGED }}
      CHANGED_COUNT: ${{ steps.discover.outputs.CHANGED_COUNT }}

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover Changed Projects
        id: discover
        env:
          PROJECTS_INPUT: ${{ inputs.projects }}
          PROJECTS_VAR: ${{ vars.MONO_PROJECTS }}
          ALWAYS_RUN_ALL: ${{ inputs.always-run-all }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          PROJECTS="${PROJECTS_INPUT:-${PROJECTS_VAR:-}}"
          if [[ -z "${PROJECTS}" ]]; then
            echo "::error title=Monorepo::No projects declared. Set the 'projects' input or vars.MONO_PROJECTS to a JSON array of {name, path} objects."
            {
              echo "### 📦 Monorepo: changed projects"
              echo ""
              echo "❌ No projects are declared, so no child pipeline can run. Set the \`projects\` input or \`vars.MONO_PROJECTS\` to a JSON array of \`{name, path}\` objects, for example:"
              echo ""
              echo '```json'
              echo '[{"name":"api","path":"services/api"},{"name":"web","path":"services/web"}]'
              echo '```'
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if ! jq -e 'type == "array" and length > 0' <<<"${PROJECTS}" >/dev/null 2>&1; then
            echo "::error title=Monorepo::'projects' is not a non-empty JSON array."
            {
              echo "### 📦 Monorepo: changed projects"
              echo ""
              echo "❌ The projects list is not a non-empty JSON array, so no child pipeline can run. jq reported:"
              echo ""
              echo '```'
              jq . <<<"${PROJECTS}" 2>&1 | head -n 10
              echo '```'
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          DECLARED="$(jq 'length' <<<"${PROJECTS}")"
          RANGE="every project (always-run-all)"
          if [[ "${ALWAYS_RUN_ALL}" == "true" ]]; then
            echo "always-run-all is set — selecting every project."
            SELECTED="${PROJECTS}"
          else
            # GitLab's `changes:` spans the whole pushed range
            # (CI_COMMIT_BEFORE_SHA..HEAD), not just the tip commit: a push of
            # three commits that touched a project only in the first one still
            # builds it. github.event.before is that same boundary — all zeroes
            # on a branch's first push, where there is nothing to compare to.
            if [[ -n "${BASE_SHA}" ]]; then
              COMPARE_BASE="${BASE_SHA}"
            elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
              COMPARE_BASE="${BEFORE_SHA}"
            else
              COMPARE_BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
            fi

            # A base that is not in this checkout — a force-pushed target branch,
            # a rewritten history — would otherwise abort the step. GitLab treats
            # a `changes:` rule it cannot evaluate as true and runs the job, and
            # that is the only safe direction: skipping a project that did change
            # is the one outcome a monorepo gate must never produce.
            if [[ -n "${COMPARE_BASE}" ]] && ! git cat-file -e "${COMPARE_BASE}^{commit}" 2>/dev/null; then
              echo "::warning title=Monorepo::Comparison base ${COMPARE_BASE} is not in this checkout. Selecting every project."
              COMPARE_BASE=""
            elif [[ -z "${COMPARE_BASE}" ]]; then
              echo "::warning title=Monorepo::No comparison base (first commit?). Selecting every project."
            fi

            if [[ -z "${COMPARE_BASE}" ]]; then
              RANGE="every project — no usable comparison base"
              SELECTED="${PROJECTS}"
            else
              CHANGED_FILES="$(git diff --name-only "${COMPARE_BASE}" HEAD)"
              CHANGED_COUNT="$(grep -c . <<<"${CHANGED_FILES}" || true)"
              echo "Comparing against ${COMPARE_BASE} — ${CHANGED_COUNT} changed files."
              RANGE="\`${COMPARE_BASE:0:7}..HEAD\` — ${CHANGED_COUNT} changed file(s)"

              # GitLab's convention writes these paths as `./backend`, while
              # `git diff --name-only` prints `backend/...`. A projects list
              # carried over from the GitLab config verbatim would then match
              # nothing at all and quietly build no project, so normalise first.
              SELECTED="$(jq -c --arg files "${CHANGED_FILES}" '
                ($files | split("\n") | map(select(length > 0))) as $changed
                | map(
                    (.path | sub("^\\./"; "") | sub("/+$"; "")) as $p
                    | select(
                        $p == "" or $p == "."
                        or ($changed | any(. == $p or startswith($p + "/")))
                      )
                  )
              ' <<<"${PROJECTS}")"
            fi
          fi

          COUNT="$(jq 'length' <<<"${SELECTED}")"
          MATRIX="$(jq -c '{include: .}' <<<"${SELECTED}")"
          ANY_CHANGED=false
          [[ "${COUNT}" -gt 0 ]] && ANY_CHANGED=true

          {
            echo "MATRIX=${MATRIX}"
            echo "ANY_CHANGED=${ANY_CHANGED}"
            echo "CHANGED_COUNT=${COUNT}"
          } >> "${GITHUB_OUTPUT}"

          # Selecting nothing is a legitimate outcome and a silent failure look
          # alike from the outside, so the comparison range and the declared
          # count are stated either way — that is what tells them apart.
          {
            echo "### 📦 Monorepo: changed projects"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Declared** | ${DECLARED} |"
            echo "| **Selected** | ${COUNT} |"
            echo "| **Compared over** | ${RANGE} |"
            echo ""
            if [[ "${COUNT}" -eq 0 ]]; then
              echo "No declared project's path matched a changed file, so every downstream job is skipped. If that is wrong, check that the \`path\` values line up with the repository layout:"
              echo ""
              echo '```'
              jq -r '.[] | .path' <<<"${PROJECTS}"
              echo '```'
            else
              echo "| Project | Path |"
              echo "|---|---|"
              jq -r '.[] | "| **\(.name)** | `\(.path)` |"' <<<"${SELECTED}"
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
