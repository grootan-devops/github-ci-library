name: Terraform / Init, Validate & Lint

# Counterpart of the GitLab Terraform:Init, Terraform:Validate, Terraform:Lint
# and Terraform:Check:README jobs. Init runs once; validate and tflint then run
# in parallel against the initialised working directory. The docs check reads
# only the sources, so — like GitLab's Terraform:Check:README, which needs only
# Common:Init — it runs beside init instead of behind it.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."
      state-name:
        required: false
        type: string
        default: ""
        description: "Workspace key prefix component for the backend configuration."
      check-docs:
        required: false
        type: boolean
        default: true
        description: "Fail when a generated README.md is out of date."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  # GitLab gates every Terraform job on `exists: ${PROJECT_PATH}/main.tf`. An
  # empty matrix is the GitHub equivalent: a repository with no root module gets
  # no Terraform jobs at all, rather than a `terraform init` that fails hard.
  discover:
    name: Detect Terraform Root Module
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      root: ${{ steps.targets.outputs.root }}
      checks: ${{ steps.targets.outputs.checks }}
      docs: ${{ steps.targets.outputs.docs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Applicable Terraform Jobs
        id: targets
        env:
          PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
          CHECK_DOCS: ${{ inputs.check-docs }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_PATH}"

          ROOT='[]'
          CHECKS='[]'
          DOCS='[]'

          if [[ -f main.tf ]]; then
            ROOT='[{"module":"root"}]'
            CHECKS='[{"name":"Validate","check":"validate"},{"name":"TFLint","check":"tflint"}]'
            if [[ "${CHECK_DOCS}" == "true" ]]; then
              DOCS="${ROOT}"
            fi
          else
            echo "::warning title=Terraform::No main.tf in ${PROJECT_PATH} — the Terraform checks do not apply."
          fi

          {
            echo "root=${ROOT}"
            echo "checks=${CHECKS}"
            echo "docs=${DOCS}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### 🌍 Applicable Terraform jobs"
            echo ""
            if [[ "${ROOT}" == "[]" ]]; then
              echo "- None — no \`main.tf\` root module."
            else
              echo "- Init"
              jq -r '.[] | "- \(.name)"' <<< "${CHECKS}"
              if [[ "${DOCS}" != "[]" ]]; then
                echo "- Documentation"
              fi
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  init:
    name: Init
    needs: discover
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.root) }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # hashFiles returns "" when the lock file is absent, collapsing the
      # key onto the bare `tf-` restore-keys prefix — an unpinned provider
      # set every later run would then fall back to and never invalidate.
      - name: Compute Provider Cache Key
        id: key
        run: echo "key=tf-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.project-path || vars.PROJECT_PATH || '.')) || 'nolock' }}" >> "${GITHUB_OUTPUT}"

      - name: Restore Provider Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/.terraform
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/.terraform.lock.hcl
          key: ${{ steps.key.outputs.key }}
          restore-keys: tf-

      - name: Terraform Init
        id: tfinit
        env:
          TF_STATE_NAME: ${{ inputs.state-name }}
        run: |
          set -uo pipefail
          SLUG="${GITHUB_REPOSITORY//\//_}"
          # Capture as well as stream: `terraform init` says whether it was the
          # backend, a provider constraint or a credential that stopped it, and
          # "check the backend configuration" is a guess by comparison.
          terraform init -input=false -no-color -reconfigure \
            -backend-config="workspace_key_prefix=${SLUG}/${TF_STATE_NAME}" 2>&1 | tee "${RUNNER_TEMP}/tf-init.log"
          exit "${PIPESTATUS[0]}"

      - name: Publish Init Summary
        if: always()
        env:
          OUTCOME: ${{ steps.tfinit.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          CACHE_STATE="rebuilt — no entry matched"
          [[ "${CACHE_HIT}" == "true" ]] && CACHE_STATE="restored"
          {
            echo "### 🌍 Terraform init"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ Backend initialised; providers cached for the checks (provider cache ${CACHE_STATE})."
            else
              echo "❌ \`terraform init\` failed, so neither \`validate\` nor \`tflint\` ran. Terraform reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/tf-init.log" 2>/dev/null || echo "(no output was captured)"
              echo '```'
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save Provider Cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/.terraform
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/.terraform.lock.hcl
          key: ${{ steps.key.outputs.key }}

  check:
    name: ${{ matrix.name }}
    needs: [discover, init]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.checks) }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Restore Provider Cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/.terraform
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/.terraform.lock.hcl
          key: ${{ needs.init.outputs.cache-key }}
          restore-keys: tf-

      - name: Run ${{ matrix.name }}
        id: check
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -uo pipefail
          # Capture as well as stream: both tools name the file, the line and
          # the rule. `terraform fmt -check` says nothing at all beyond the
          # file list, so the diff it would have applied goes in too.
          LOG="${RUNNER_TEMP}/tf-check.log"
          case "${CHECK}" in
            validate)
              {
                terraform validate -no-color &&
                terraform fmt -recursive -check -diff -no-color .
              } 2>&1 | tee "${LOG}"
              ;;
            tflint)
              tflint --chdir . --recursive --filter=tests/** --call-module-type=all 2>&1 | tee "${LOG}"
              ;;
          esac
          exit "${PIPESTATUS[0]}"

      - name: Publish Check Summary
        if: always()
        env:
          NAME: ${{ matrix.name }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/tf-check.log"
          {
            echo "### 🌍 Terraform: ${NAME}"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ Passed."
            else
              echo "❌ Failed. \`${NAME}\` reported:"
              echo ""
              echo '```'
              tail -n 50 "${LOG}" 2>/dev/null || echo "(no output was captured)"
              echo '```'
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  # Deliberately not `needs: init`: the check only reads the module sources, so
  # a backend or credential failure in `terraform init` must not hide stale
  # generated documentation. The script writes its own step summary.
  docs:
    name: Documentation
    needs: discover
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.docs) }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Check Generated Documentation
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/terraform-docs-check.sh"
