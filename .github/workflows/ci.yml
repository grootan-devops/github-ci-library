name: CI · PR Verification

# The library's own pipeline, the counterpart of ci-templates/.gitlab-ci.yml.
# It is only an aggregator: every dimension lives in its own `self-*.yml`
# workflow with a `workflow_dispatch` trigger, so a developer working on lint,
# on the release guards or on secret scanning can run just that one.

on:
  pull_request:
    branches: [master, main, dev]
    paths:
      - ".github/**"
      - "scripts/**"
      - "templates/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "MIGRATION.md"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/self-lint.yml
    secrets: inherit

  secret-scan:
    name: Security
    uses: ./.github/workflows/self-secret-scan.yml
    secrets: inherit

  check:
    name: Check
    uses: ./.github/workflows/self-check.yml
    secrets: inherit
