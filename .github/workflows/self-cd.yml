name: CD · Tag, Release & Notify
run-name: "CD · ${{ github.event_name }} · ${{ github.short_sha }}"

on:
  push:
    branches: [master, main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  guard-ref:
    name: Verify Ref
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse A Release From A Non-Default Ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "::error title=Release refused::A release may only be cut from '${DEFAULT_BRANCH}', not '${GITHUB_REF_NAME}'."
            {
              echo "### 🚫 Release refused"
              echo ""
              echo "\`${GITHUB_REF_NAME}\` is not the default branch (\`${DEFAULT_BRANCH}\`). A release cut from a feature branch would tag and publish work that never passed a pull request, so nothing was tagged or published."
              echo ""
              echo "Merge to \`${DEFAULT_BRANCH}\` and let the push trigger the release, or re-dispatch this workflow against \`${DEFAULT_BRANCH}\`."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "Releasing from the default branch '${DEFAULT_BRANCH}'."

  version:
    name: Version
    needs: [guard-ref]
    if: ${{ !cancelled() && needs.guard-ref.result != 'failure' }}
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  check:
    name: Release Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}

  release:
    name: Release
    needs: [version, check]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      notify: true
