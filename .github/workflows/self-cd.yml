name: CD · Tag, Release & Notify
run-name: "CD · ${{ github.event_name }} · ${{ github.sha }}"

on:
  push:
    branches: [master, main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  check:
    name: Release Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      check-library-pinning: false

  release:
    name: Release
    needs: [version, check]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      notify: true
