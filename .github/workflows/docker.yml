name: Image / Docker Build, Push & Promote

# Counterpart of the GitLab Image:Build, Image:Push and Image:Promote jobs.
# `build` pushes the candidate as it builds; `promote` retags it for release.
# `build` runs on the runner, not in the build container: it needs buildkit.
#
# ⚠️ `promote` has no `needs` on the scan — that job lives in the caller's
# workflow. The caller must run it between build and promote and pass its
# result through `scan-result`, or a vulnerable image promotes silently.

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
        description: "Tag to publish, from init.yml's image-push-tag."
      image-repository:
        required: true
        type: string
        description: "Repository to push to, from init.yml's image-push-repository."
      require-scan:
        required: false
        type: boolean
        default: true
        description: "Refuse to promote unless `scan-result` says the scan succeeded. Set false only for an artifact with no scan in its pipeline."
      scan-result:
        required: false
        type: string
        default: ""
        description: "The scan job's result, as `needs.<scan-job>.result`. Required when `require-scan` is true; an empty value refuses the promotion."
      is-release:
        required: false
        type: boolean
        default: false
        description: "true on a production release: promote the scanned candidate by digest instead of rebuilding."
      release-tag:
        required: false
        type: string
        default: ""
        description: "Production tag to promote to, from init.yml's tag."
      candidate-tag:
        required: false
        type: string
        default: ""
        description: "Exact candidate tag to promote, from init.yml."
      image-dev-repository:
        required: false
        type: string
        default: ""
        description: "Candidate repository to promote from, from init.yml."
      build-args:
        required: false
        type: string
        default: ""
        description: "Extra newline-separated KEY=VALUE build arguments, appended to the organisation defaults."
      build-context:
        required: false
        type: string
        default: ""
        description: "Build context. Defaults to the project path."
      target:
        required: false
        type: string
        default: ""
        description: "Dockerfile stage to build."
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."
      test:
        required: false
        type: boolean
        default: false
        description: "Run a smoke test inside the built image (GitLab's .Image:Test)."
      test-script:
        required: false
        type: string
        default: "ci_image_test.sh"
        description: "Script executed inside the image, relative to test-path."
      test-path:
        required: false
        type: string
        default: ""
        description: "Directory mounted into the image at /tmp. Defaults to the project path."
      test-shell:
        required: false
        type: string
        default: "bash"
        description: "Entrypoint used to run the test script."

    outputs:
      image-ref-digest:
        description: "Digest-pinned reference of the published image"
        value: ${{ jobs.build.outputs.IMAGE_REF_DIGEST }}
      image-digest:
        description: "Digest of the published image"
        value: ${{ jobs.build.outputs.IMAGE_DIGEST }}

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  DOCKERFILE: ${{ vars.DOCKERFILE || 'Dockerfile' }}
  REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_INFO_FILE_NAME: IMAGE_INFO.md

permissions:
  contents: read

jobs:
  build:
    name: Build & Push
    if: ${{ !inputs.is-release }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    outputs:
      IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
      IMAGE_REF_DIGEST: ${{ steps.ref.outputs.IMAGE_REF_DIGEST }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3
        with:
          driver-opts: image=moby/buildkit:v0.29.0

      - name: Propagate Runner Host Entries To BuildKit
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          CONTAINER="buildx_buildkit_${BUILDER_NAME}0"
          if ! docker inspect "${CONTAINER}" > /dev/null 2>&1; then
            echo "::notice title=BuildKit hosts::${CONTAINER} not running; skipping host propagation"
            exit 0
          fi
          while read -r IP HOSTS; do
            case "${IP}" in '' | '#'* | 127.0.0.1 | ::1) continue ;; esac
            for HOST in ${HOSTS}; do
              case "${HOST}" in '#'*) break ;; esac
              echo "Adding ${IP} ${HOST}"
              docker exec -u 0 "${CONTAINER}" \
                sh -c "grep -qE '[[:space:]]${HOST}([[:space:]]|\$)' /etc/hosts || echo '${IP} ${HOST}' >> /etc/hosts"
            done
          done < /etc/hosts
          docker exec "${CONTAINER}" cat /etc/hosts

      - name: Resolve Login Registry
        id: login-registry
        env:
          REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          # docker/login-action stores the credential under the key it is GIVEN;
          # BuildKit resolves Docker Hub as https://index.docker.io/v1/.
          case "${REGISTRY_HOST}" in
            docker.io|index.docker.io|registry-1.docker.io) VALUE="" ;;
            *) VALUE="${REGISTRY_HOST}" ;;
          esac
          echo "value=${VALUE}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate To Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ${{ steps.login-registry.outputs.value }}
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}

      - name: Assemble Base Image Build Arguments
        id: args
        env:
          EXTRA_BUILD_ARGS: ${{ inputs.build-args }}
          VERSION: ${{ inputs.image-tag }}
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          MICRO_ROOT_BASE_IMAGE: registry-1.docker.io/grootantech/micro-root:verify-v1
          NGINX_MICRO_BASE_IMAGE: registry-1.docker.io/grootantech/micro-nginx:verify-v1
          PYTHON_312_MICRO_BASE_IMAGE: registry-1.docker.io/grootantech/micro-python-3-12:verify-v1
          NODE_JS_24_MICRO_BASE_IMAGE: registry-1.docker.io/grootantech/micro-node-24:verify-v1
          JAVA_25_MICRO_BASE_IMAGE: registry-1.docker.io/grootantech/micro-java-25:verify-v1
          TOOLKIT_BUILD_IMAGE: registry-1.docker.io/grootantech/toolkit:verify-v2
        run: |
          set -euo pipefail
          {
            echo "args<<BUILD_ARGS_EOF"
            echo "VERSION=${VERSION}"
            echo "MICRO_ROOT_BASE_IMAGE=${REGISTRY}/${MICRO_ROOT_BASE_IMAGE}"
            echo "NGINX_MICRO_BASE_IMAGE=${REGISTRY}/${NGINX_MICRO_BASE_IMAGE}"
            echo "PYTHON_312_MICRO_BASE_IMAGE=${REGISTRY}/${PYTHON_312_MICRO_BASE_IMAGE}"
            echo "NODE_JS_24_MICRO_BASE_IMAGE=${REGISTRY}/${NODE_JS_24_MICRO_BASE_IMAGE}"
            echo "JAVA_25_MICRO_BASE_IMAGE=${REGISTRY}/${JAVA_25_MICRO_BASE_IMAGE}"
            echo "TOOLKIT_BUILD_IMAGE=${REGISTRY}/${TOOLKIT_BUILD_IMAGE}"
            if [[ -n "${EXTRA_BUILD_ARGS}" ]]; then
              printf '%s\n' "${EXTRA_BUILD_ARGS}"
            fi
            echo "BUILD_ARGS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve Cache Tag
        id: cache-tag
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # `github.ref_name` is `<n>/merge` on a pull request, and a Docker tag admits
          # only [A-Za-z0-9_.-]. Interpolated raw, the registry cache exporter rejects the
          # whole reference with "invalid reference format" and the build fails -- on every
          # pull request, which is where the cache matters most.
          sanitise() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100; }
          {
            echo "ref=$(sanitise "${REF_NAME}")"
            echo "default=$(sanitise "${DEFAULT_BRANCH}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Build & Push Image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: ${{ inputs.build-context || inputs.project-path || vars.PROJECT_PATH || '.' }}
          file: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/${{ vars.DOCKERFILE || 'Dockerfile' }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}/${{ inputs.image-repository }}:${{ inputs.image-tag }}
          build-args: ${{ steps.args.outputs.args }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ inputs.image-tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=registry,ref=${{ vars.IMAGE_REGISTRY }}/${{ inputs.image-repository }}:buildcache-${{ steps.cache-tag.outputs.ref }}
            type=registry,ref=${{ vars.IMAGE_REGISTRY }}/${{ inputs.image-repository }}:buildcache-${{ steps.cache-tag.outputs.default }}
          cache-to: type=registry,ref=${{ vars.IMAGE_REGISTRY }}/${{ inputs.image-repository }}:buildcache-${{ steps.cache-tag.outputs.ref }},mode=max

      - name: Publish Digest-Pinned Reference
        id: ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          REF="${REGISTRY_HOST}/${REPO}@${DIGEST}"
          echo "IMAGE_REF_DIGEST=${REF}" >> "${GITHUB_OUTPUT}"

          {
            echo "### 🐳 Container Image"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Tag** | \`${REGISTRY_HOST}/${REPO}:${{ inputs.image-tag }}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Pinned reference** | \`${REF}\` |"
            echo ""
          } > "${IMAGE_INFO_FILE_NAME}"
          cat "${IMAGE_INFO_FILE_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Image Info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-info
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/IMAGE_INFO.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Build Failure Summary
        if: failure()
        env:
          REPO: ${{ inputs.image-repository }}
          TAG: ${{ inputs.image-tag }}
          BUILD_CONTEXT: ${{ inputs.build-context || inputs.project-path || vars.PROJECT_PATH || '.' }}
          BUILD_FILE: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/${{ vars.DOCKERFILE || 'Dockerfile' }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### 🐳 Container Image"
            echo ""
            echo "❌ \`${REGISTRY_HOST}/${REPO}:${TAG}\` was not built. No candidate exists for the scan or the promotion to consume."
            echo ""
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| **Dockerfile** | \`${BUILD_FILE}\` |"
            echo "| **Context** | \`${BUILD_CONTEXT}\` |"
            echo "| **Stage** | \`${BUILD_TARGET:-(final)}\` |"
            echo "| **Build & push step** | \`${PUSH_OUTCOME}\` |"
            echo ""
            if [[ -n "${BUILD_ARGS}" ]]; then
              echo "<details><summary>Build arguments the base images resolved to</summary>"
              echo ""
              echo '```'
              echo "${BUILD_ARGS}"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            echo "BuildKit's own error is in the **Build & Push Image** step of the log; a composite action's output cannot be read back from here."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Smoke Test
    needs: build
    if: ${{ !cancelled() && inputs.test && !inputs.is-release && needs.build.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Resolve Login Registry
        id: login-registry
        env:
          REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          # Empty registry = Docker Hub's canonical key; see the build job.
          case "${REGISTRY_HOST}" in
            docker.io|index.docker.io|registry-1.docker.io) VALUE="" ;;
            *) VALUE="${REGISTRY_HOST}" ;;
          esac
          echo "value=${VALUE}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate To Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ${{ steps.login-registry.outputs.value }}
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}

      - name: Run Smoke Test Inside The Image
        id: smoke
        env:
          IMAGE_REF: ${{ needs.build.outputs.IMAGE_REF_DIGEST }}
          TEST_SCRIPT: ${{ inputs.test-script }}
          TEST_PATH: ${{ inputs.test-path }}
          TEST_SHELL: ${{ inputs.test-shell }}
        run: |
          set -uo pipefail
          MOUNT="${TEST_PATH:-.}"

          if [[ ! -f "${MOUNT}/${TEST_SCRIPT}" ]]; then
            echo "::error title=Image test::${MOUNT}/${TEST_SCRIPT} not found. Provide the script, or set test: false."
            {
              echo "### 🧪 Image smoke test"
              echo ""
              echo "❌ \`${MOUNT}/${TEST_SCRIPT}\` does not exist, so nothing was run inside \`${IMAGE_REF}\`. Add the script, point \`test-script\`/\`test-path\` at it, or set \`test: false\`."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          docker run --rm -a STDOUT -a STDERR \
            -v "${PWD}/${MOUNT}:/tmp/image-test:ro" \
            --entrypoint "${TEST_SHELL}" \
            "${IMAGE_REF}" -c "cd /tmp/image-test && ./${TEST_SCRIPT}" 2>&1 | tee "${RUNNER_TEMP}/smoke.log"
          exit "${PIPESTATUS[0]}"

      - name: Publish Smoke Test Summary
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        env:
          IMAGE_REF: ${{ needs.build.outputs.IMAGE_REF_DIGEST }}
          TEST_SCRIPT: ${{ inputs.test-script }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          # The missing-script case already wrote its own section above.
          [[ -f "${RUNNER_TEMP}/smoke.log" ]] || exit 0
          {
            echo "### 🧪 Image smoke test"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ \`${TEST_SCRIPT}\` passed inside \`${IMAGE_REF}\`."
            else
              echo "❌ \`${TEST_SCRIPT}\` failed inside \`${IMAGE_REF}\`. It reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/smoke.log"
              echo '```'
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote
    if: ${{ inputs.is-release }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      # A skipped job reads as success to the caller's graph, so this refuses
      # with a failing step rather than an `if:` condition.
      - name: Verify The Candidate Was Scanned
        env:
          REQUIRE_SCAN: ${{ inputs.require-scan }}
          SCAN_RESULT: ${{ inputs.scan-result }}
        run: |
          set -euo pipefail

          if [[ "${REQUIRE_SCAN}" != "true" ]]; then
            echo "::notice title=Promotion::require-scan is off; promoting without a scan verdict."
            exit 0
          fi

          if [[ "${SCAN_RESULT}" == "success" ]]; then
            echo "Candidate was scanned and the scan passed."
            exit 0
          fi

          if [[ -z "${SCAN_RESULT}" ]]; then
            echo "::error title=Promotion refused::No scan result was passed. The scan runs in your workflow, so this one cannot depend on it directly — pass the scan job's result through the 'scan-result' input, or set 'require-scan: false' if this artifact has no scan."
            REASON="no \`scan-result\` was passed. The scan runs in your workflow, so this one cannot depend on it directly — pass the scan job's \`result\` through the \`scan-result\` input, or set \`require-scan: false\` if this artifact has no scan."
          else
            echo "::error title=Promotion refused::The scan did not succeed (result: ${SCAN_RESULT}). Refusing to promote an image that failed or skipped its scan."
            REASON="the scan job reported \`${SCAN_RESULT}\`, not \`success\`. Fix the scan, or justify its findings in \`ignored-cves.yml\`, before promoting."
          fi
          {
            echo "### 🚫 Promotion refused"
            echo ""
            echo "The candidate image has not been promoted: ${REASON}"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Promote Candidate Image To Production
        env:
          REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          TAG: ${{ inputs.release-tag }}
          CANDIDATE_TAG: ${{ inputs.candidate-tag }}
          DEV_REPOSITORY: ${{ inputs.image-dev-repository }}
          PROD_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          set -euo pipefail
          crane auth login "${REGISTRY_HOST}" --username "${REGISTRY_USERNAME}" --password "${REGISTRY_PASSWORD}"

          DEV_IMAGE="${REGISTRY_HOST}/${DEV_REPOSITORY}"
          PROD_IMAGE="${REGISTRY_HOST}/${PROD_REPOSITORY}"
          SOURCE=""

          if [[ -n "${CANDIDATE_TAG}" ]] && crane manifest "${DEV_IMAGE}:${CANDIDATE_TAG}" >/dev/null 2>&1; then
            SOURCE="${DEV_IMAGE}:${CANDIDATE_TAG}"
          else
            RC_TAG="$(crane ls "${DEV_IMAGE}" 2>/dev/null | grep -E "^${TAG//./\\.}-" | sort -V | tail -n1 || true)"
            if [[ -n "${RC_TAG}" ]] && crane manifest "${DEV_IMAGE}:${RC_TAG}" >/dev/null 2>&1; then
              SOURCE="${DEV_IMAGE}:${RC_TAG}"
            elif crane manifest "${DEV_IMAGE}:${TAG}" >/dev/null 2>&1; then
              SOURCE="${DEV_IMAGE}:${TAG}"
            fi
          fi

          if [[ -z "${SOURCE}" ]]; then
            echo "::error title=Image promote::No candidate image found in ${DEV_IMAGE} for ${TAG}. Nothing was scanned that could be promoted."
            {
              echo "### 🐳 Container Image"
              echo ""
              echo "❌ \`${TAG}\` was not promoted: no candidate in \`${DEV_IMAGE}\` matched \`${CANDIDATE_TAG:-${TAG}-*}\`. The production tag is unchanged."
              echo ""
              echo "Tags that do exist in the candidate repository:"
              echo ""
              echo '```'
              crane ls "${DEV_IMAGE}" 2>&1 | tail -n 20 || echo "(the candidate repository could not be listed either)"
              echo '```'
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          SOURCE_DIGEST="$(crane digest "${SOURCE}")"
          echo "📦 Promoting ${SOURCE} (${SOURCE_DIGEST}) to ${PROD_IMAGE}:${TAG}"

          if ! MUTATE_OUTPUT="$(crane mutate "${SOURCE}" --label "org.opencontainers.image.version=${TAG}" --tag "${PROD_IMAGE}:${TAG}" 2>&1)"; then
            echo "${MUTATE_OUTPUT}" >&2
            echo "::error title=Image promote::${PROD_IMAGE}:${TAG} was refused by the registry."
            {
              echo "### 🐳 Container Image"
              echo ""
              echo "❌ \`${PROD_IMAGE}:${TAG}\` was refused. The scanned candidate \`${SOURCE}\` (\`${SOURCE_DIGEST}\`) is unchanged in the dev repository, so a re-run can promote it once this is fixed. crane reported:"
              echo ""
              echo '```'
              tail -n 30 <<< "${MUTATE_OUTPUT}"
              echo '```'
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "${MUTATE_OUTPUT}"

          crane tag "${PROD_IMAGE}:${TAG}" latest
          MAJOR="$(grep -Eo '^[0-9]+' <<<"${TAG}" || true)"
          MINOR="$(grep -Eo '^[0-9]+\.[0-9]+' <<<"${TAG}" || true)"
          [[ -n "${MAJOR}" ]] && crane tag "${PROD_IMAGE}:${TAG}" "${MAJOR}"
          [[ -n "${MINOR}" ]] && crane tag "${PROD_IMAGE}:${TAG}" "${MINOR}"

          PROD_DIGEST="$(crane digest "${PROD_IMAGE}:${TAG}")"
          {
            echo "### 🐳 Container Image"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Promoted from** | \`${SOURCE}\` |"
            echo "| **Released as** | \`${PROD_IMAGE}:${TAG}\` |"
            echo "| **Aliases** | \`latest\`${MAJOR:+, \`${MAJOR}\`}${MINOR:+, \`${MINOR}\`} |"
            echo "| **Digest** | \`${PROD_DIGEST}\` |"
            # `crane mutate` rewrites the version label, so the scanned
            # candidate's digest differs from the released one by design.
            echo "| **Scanned candidate digest** | \`${SOURCE_DIGEST}\` |"
            echo ""
          } > "${IMAGE_INFO_FILE_NAME}"
          cat "${IMAGE_INFO_FILE_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Image Info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-info
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/IMAGE_INFO.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish Promotion Failure Summary
        if: failure()
        env:
          TAG: ${{ inputs.release-tag }}
          DEV_REPOSITORY: ${{ inputs.image-dev-repository }}
        run: |
          set -euo pipefail
          {
            echo "### 🐳 Container Image"
            echo ""
            echo "❌ \`${TAG}\` was not promoted. Either nothing in \`${REGISTRY_HOST}/${DEV_REPOSITORY}\` matched it or the registry refused the retag; the production tag is unchanged."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
