name: Image / Docker Build, Push & Promote

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
        description: "Tag to publish, from init.yml's image-push-tag."
      image-repository:
        required: true
        type: string
        description: "Repository to push to, from init.yml's image-push-repository. With vars.PROJECT_REGISTRY_NAME, the full <registry>/<path> repositories, primary first."
      require-scan:
        required: false
        type: boolean
        default: true
        description: "Refuse to promote unless `scan-result` says the scan succeeded. Set false only for an artifact with no scan in its pipeline."
      scan-result:
        required: false
        type: string
        default: ""
        description: "The scan job's result, as `needs.<scan-job>.result`. Required when `require-scan` is true; an empty value refuses the promotion."
      is-release:
        required: false
        type: boolean
        default: false
        description: "true on a production release: promote the scanned candidate by digest instead of rebuilding."
      release-tag:
        required: false
        type: string
        default: ""
        description: "Production tag to promote to, from init.yml's tag."
      candidate-tag:
        required: false
        type: string
        default: ""
        description: "Exact candidate tag to promote, from init.yml."
      image-dev-repository:
        required: false
        type: string
        default: ""
        description: "Candidate repository to promote from, from init.yml's image-dev-repository."
      build-args:
        required: false
        type: string
        default: ""
        description: "Extra newline-separated KEY=VALUE build arguments, appended to the organisation defaults."
      build-context:
        required: false
        type: string
        default: ""
        description: "Build context. Defaults to the project path."
      target:
        required: false
        type: string
        default: ""
        description: "Dockerfile stage to build."
      project-path:
        required: false
        type: string
        default: "."
        description: "Project root. Monorepo children set this."
      test:
        required: false
        type: boolean
        default: false
        description: "Run a smoke test inside the built image (GitLab's .Image:Test)."
      test-script:
        required: false
        type: string
        default: "ci_image_test.sh"
        description: "Script executed inside the image, relative to test-path."
      test-path:
        required: false
        type: string
        default: ""
        description: "Directory mounted into the image at /tmp. Defaults to the project path."
      test-shell:
        required: false
        type: string
        default: "bash"
        description: "Entrypoint used to run the test script."

    outputs:
      image-ref-digest:
        description: "Digest-pinned reference of the published image in the primary registry"
        value: ${{ jobs.build.outputs.IMAGE_REF_DIGEST }}
      image-digest:
        description: "Digest of the published image; the same in every registry"
        value: ${{ jobs.build.outputs.IMAGE_DIGEST }}

env:
  PROJECT_PATH: ${{ inputs.project-path }}
  DOCKERFILE: ${{ vars.DOCKERFILE || 'Dockerfile' }}
  REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  PROJECT_REGISTRY_NAME: ${{ vars.PROJECT_REGISTRY_NAME }}
  IMAGE_INFO_FILE_NAME: IMAGE_INFO.md

permissions:
  contents: read

jobs:
  build:
    name: Build & Push
    if: ${{ !inputs.is-release }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    outputs:
      IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
      IMAGE_REF_DIGEST: ${{ steps.ref.outputs.IMAGE_REF_DIGEST }}
      OTHER_REGISTRIES: ${{ steps.targets.outputs.others }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Resolve Image Targets
        id: targets
        env:
          KIND: image
          REPOSITORIES: ${{ inputs.image-repository }}
          TAG: ${{ inputs.image-tag }}
          REGISTRY_CONFIG: ${{ secrets.REGISTRY_CONFIG }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/targets.sh"

      - name: Set Up Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3
        with:
          driver-opts: image=moby/buildkit:v0.34.1

      - name: Propagate Runner Host Entries To BuildKit
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          CONTAINER="buildx_buildkit_${BUILDER_NAME}0"
          if ! docker inspect "${CONTAINER}" > /dev/null 2>&1; then
            echo "::notice title=BuildKit hosts::${CONTAINER} not running; skipping host propagation"
            exit 0
          fi
          while read -r IP HOSTS; do
            if [[ -z "${IP}" || "${IP}" == '#'* || "${IP}" == "127.0.0.1" || "${IP}" == "::1" ]]; then
              continue
            fi
            for HOST in ${HOSTS}; do
              if [[ "${HOST}" == '#'* ]]; then
                break
              fi
              echo "Adding ${IP} ${HOST}"
              docker exec -u 0 "${CONTAINER}" sh -c "
                if ! grep -qE '[[:space:]]${HOST}([[:space:]]|\$)' /etc/hosts; then
                  echo '${IP} ${HOST}' >> /etc/hosts
                fi
              "
            done
          done < /etc/hosts
          docker exec "${CONTAINER}" cat /etc/hosts

      # BuildKit pushes to the primary registry only, so only it is logged in
      # to; Docker Hub is stored under the default index key BuildKit resolves
      # it by.
      - name: Authenticate To Registry
        id: login
        env:
          TOOL: docker
          KIND: image
          REPOSITORIES: ${{ inputs.image-repository }}
          REGISTRY_CONFIG: ${{ secrets.REGISTRY_CONFIG }}
          IMAGE_REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          IMAGE_REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/login.sh"

      - name: Assemble Base Image Build Arguments
        id: args
        env:
          EXTRA_BUILD_ARGS: ${{ inputs.build-args }}
          VERSION: ${{ inputs.image-tag }}
          REGISTRY: ${{ steps.targets.outputs.primary }}
          MICRO_ROOT_BASE_IMAGE: grootantech/micro-root:1.2.0
          NGINX_MICRO_BASE_IMAGE: grootantech/micro-nginx:1.2.1
          PYTHON_312_MICRO_BASE_IMAGE: grootantech/micro-python-3-12:1.2.1
          NODE_JS_24_MICRO_BASE_IMAGE: grootantech/micro-node-24:1.2.1
          JAVA_25_MICRO_BASE_IMAGE: grootantech/micro-java-25:1.3.1
          TOOLKIT_BUILD_IMAGE: grootantech/toolkit:2.0.1
        run: |
          set -euo pipefail
          {
            echo "args<<BUILD_ARGS_EOF"
            echo "VERSION=${VERSION}"
            echo "MICRO_ROOT_BASE_IMAGE=${REGISTRY}/${MICRO_ROOT_BASE_IMAGE}"
            echo "NGINX_MICRO_BASE_IMAGE=${REGISTRY}/${NGINX_MICRO_BASE_IMAGE}"
            echo "PYTHON_312_MICRO_BASE_IMAGE=${REGISTRY}/${PYTHON_312_MICRO_BASE_IMAGE}"
            echo "NODE_JS_24_MICRO_BASE_IMAGE=${REGISTRY}/${NODE_JS_24_MICRO_BASE_IMAGE}"
            echo "JAVA_25_MICRO_BASE_IMAGE=${REGISTRY}/${JAVA_25_MICRO_BASE_IMAGE}"
            echo "TOOLKIT_BUILD_IMAGE=${REGISTRY}/${TOOLKIT_BUILD_IMAGE}"
            if [[ -n "${EXTRA_BUILD_ARGS}" ]]; then
              printf '%s\n' "${EXTRA_BUILD_ARGS}"
            fi
            echo "BUILD_ARGS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build & Push Image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.build-context || inputs.project-path }}
          file: ${{ inputs.project-path }}/${{ vars.DOCKERFILE || 'Dockerfile' }}
          target: ${{ inputs.target }}
          push: true
          # The primary registry only; the copy job gives every other one this
          # image by digest.
          tags: ${{ steps.targets.outputs.ref }}
          build-args: ${{ steps.args.outputs.args }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ inputs.image-tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish Digest-Pinned Reference
        id: ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PRIMARY: ${{ steps.targets.outputs.primary }}
          REPO: ${{ steps.targets.outputs.repository }}
          TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          REF="${PRIMARY}/${REPO}@${DIGEST}"
          echo "IMAGE_REF_DIGEST=${REF}" >> "${GITHUB_OUTPUT}"

          {
            echo "### 🐳 Container Image"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Tag** | \`${PRIMARY}/${REPO}:${TAG}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Pinned reference** | \`${REF}\` |"
            echo ""
          } > "${IMAGE_INFO_FILE_NAME}"
          cat "${IMAGE_INFO_FILE_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Image Info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-info
          path: ${{ inputs.project-path }}/IMAGE_INFO.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Build Failure Summary
        if: failure()
        env:
          REGISTRY_HOST: ${{ steps.targets.outputs.primary || vars.IMAGE_REGISTRY }}
          REPO: ${{ steps.targets.outputs.repository || inputs.image-repository }}
          TAG: ${{ inputs.image-tag }}
          BUILD_CONTEXT: ${{ inputs.build-context || inputs.project-path }}
          BUILD_FILE: ${{ inputs.project-path }}/${{ vars.DOCKERFILE || 'Dockerfile' }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ steps.args.outputs.args }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/docker/build-failure-summary.sh"

      - name: Log Out Of Registry
        if: ${{ always() && (steps.login.outcome == 'success' || steps.login.outcome == 'failure') }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/logout.sh"

  # With vars.PROJECT_REGISTRY_NAME the build pushed to the primary repository
  # only. Every other repository receives that image by digest, each registry
  # logged in to with its own credentials, so all of them hold the bytes the
  # scan looks at under one digest.
  copy:
    name: Copy To Other Registries
    needs: build
    if: ${{ needs.build.outputs.OTHER_REGISTRIES == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: grootantech/toolkit:2.0.1
    steps:
      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Copy Candidate To Other Registries
        env:
          REGISTRY_CONFIG: ${{ secrets.REGISTRY_CONFIG }}
          REPOSITORY: ${{ inputs.image-repository }}
          TAG: ${{ inputs.image-tag }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/mirror-image.sh"

  test:
    name: Smoke Test
    needs: build
    if: ${{ !cancelled() && inputs.test && !inputs.is-release && needs.build.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      # The smoke test pulls the primary registry's pinned reference.
      - name: Authenticate To Registry
        id: login
        env:
          TOOL: docker
          KIND: image
          REPOSITORIES: ${{ inputs.image-repository }}
          REGISTRY_CONFIG: ${{ secrets.REGISTRY_CONFIG }}
          IMAGE_REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          IMAGE_REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/login.sh"

      - name: Run Smoke Test Inside The Image
        id: smoke
        env:
          IMAGE_REF: ${{ needs.build.outputs.IMAGE_REF_DIGEST }}
          TEST_SCRIPT: ${{ inputs.test-script }}
          TEST_PATH: ${{ inputs.test-path }}
          TEST_SHELL: ${{ inputs.test-shell }}
        run: |
          set -uo pipefail
          MOUNT="${TEST_PATH:-.}"

          if [[ ! -f "${MOUNT}/${TEST_SCRIPT}" ]]; then
            echo "::error title=Image test::${MOUNT}/${TEST_SCRIPT} not found. Provide the script, or set test: false."
            {
              echo "### 🧪 Image smoke test"
              echo ""
              echo "❌ \`${MOUNT}/${TEST_SCRIPT}\` does not exist, so nothing was run inside \`${IMAGE_REF}\`. Add the script, point \`test-script\`/\`test-path\` at it, or set \`test: false\`."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          docker run --rm -a STDOUT -a STDERR \
            -v "${PWD}/${MOUNT}:/tmp/image-test:ro" \
            --entrypoint "${TEST_SHELL}" \
            "${IMAGE_REF}" -c "cd /tmp/image-test && ./${TEST_SCRIPT}" 2>&1 | tee "${RUNNER_TEMP}/smoke.log"
          exit "${PIPESTATUS[0]}"

      - name: Publish Smoke Test Summary
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        env:
          IMAGE_REF: ${{ needs.build.outputs.IMAGE_REF_DIGEST }}
          TEST_SCRIPT: ${{ inputs.test-script }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          # The missing-script case already wrote its own section above.
          if [[ ! -f "${RUNNER_TEMP}/smoke.log" ]]; then
            exit 0
          fi
          {
            echo "### 🧪 Image smoke test"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ \`${TEST_SCRIPT}\` passed inside \`${IMAGE_REF}\`."
            else
              echo "❌ \`${TEST_SCRIPT}\` failed inside \`${IMAGE_REF}\`. It reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/smoke.log"
              echo '```'
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log Out Of Registry
        if: ${{ always() && (steps.login.outcome == 'success' || steps.login.outcome == 'failure') }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/logout.sh"

  promote:
    name: Promote
    if: ${{ inputs.is-release }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    # The release is copied to every other registry after the promotion.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    container:
      image: grootantech/toolkit:2.0.1
    steps:
      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Verify The Candidate Was Scanned
        env:
          REQUIRE_SCAN: ${{ inputs.require-scan }}
          SCAN_RESULT: ${{ inputs.scan-result }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/docker/verify-scanned.sh"

      - name: Promote Candidate Image To Production
        id: promote
        env:
          REGISTRY_CONFIG: ${{ secrets.REGISTRY_CONFIG }}
          IMAGE_REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          IMAGE_REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          TAG: ${{ inputs.release-tag }}
          CANDIDATE_TAG: ${{ inputs.candidate-tag }}
          DEV_REPOSITORY: ${{ inputs.image-dev-repository }}
          PROD_REPOSITORY: ${{ inputs.image-repository }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/docker/promote-image.sh"

      # Every other registry receives the promoted image itself, by digest, so
      # all of them ship the bytes the scan looked at.
      - name: Copy Release To Other Registries
        env:
          REGISTRY_CONFIG: ${{ secrets.REGISTRY_CONFIG }}
          REPOSITORY: ${{ inputs.image-repository }}
          TAG: ${{ inputs.release-tag }}
          ALIASES: "true"
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/registry/mirror-image.sh"

      - name: Upload Image Info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: image-info
          path: IMAGE_INFO.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish Promotion Failure Summary
        if: ${{ failure() && steps.promote.outcome == 'failure' }}
        env:
          TAG: ${{ inputs.release-tag }}
          DEV_REPOSITORY: ${{ inputs.image-dev-repository }}
        run: |
          set -euo pipefail
          # The promotion happens in the primary, the first repository, which
          # with vars.PROJECT_REGISTRY_NAME already names its registry.
          read -r DEV _ <<< "${DEV_REPOSITORY//,/ }" || true
          {
            echo "### 🐳 Container Image"
            echo ""
            echo "❌ \`${TAG}\` was not promoted. Either nothing in \`${REGISTRY_HOST:+${REGISTRY_HOST}/}${DEV}\` matched it or the registry refused the retag; the production tag is unchanged."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
