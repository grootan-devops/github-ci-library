name: CD · Tag, Release & Notify

# Release side of the library's own pipeline. Merging to master tags the
# repository, publishes the GitHub Release with the changelog and migration
# sections, and posts the Microsoft Teams Adaptive Card.

on:
  push:
    branches: [master, main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  version:
    name: Version
    uses: ./.github/workflows/self-version.yml
    secrets: inherit

  # Runs again on master so the release is gated on the same guards the pull
  # request passed, and so the changelog and migration sections it extracts
  # become the release notes.
  check:
    name: Release Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}

  release:
    name: Release
    needs: [version, check]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.tag }}
      notify: true
