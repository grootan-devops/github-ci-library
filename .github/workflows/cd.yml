name: CD · Tag, Release & Notify

# Release side of the library's own pipeline. Merging to master tags the
# repository, publishes the GitHub Release with the changelog and migration
# sections, and posts the Microsoft Teams Adaptive Card.

on:
  push:
    branches: [master, main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write

jobs:
  version:
    name: "Version: Resolve"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
      credentials:
        username: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
        password: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
    outputs:
      TAG: ${{ steps.read.outputs.TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read VERSION
        id: read
        run: |
          set -euo pipefail
          TAG="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::'${TAG}' is not a semantic version."
            exit 1
          fi
          echo "TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo "### 🏷️ Library version"
            echo ""
            echo "Releasing \`${TAG}\`."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  # Runs again on master so the release is gated on the same guards the pull
  # request passed, and so the changelog and migration sections it extracts
  # become the release notes.
  check:
    name: Release Guards
    needs: version
    uses: ./.github/workflows/check.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.TAG }}

  release:
    name: Release
    needs: [version, check]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.version.outputs.TAG }}
      notify: true
