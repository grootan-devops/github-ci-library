name: Node / Dependency, Build & Test

# Counterpart of the GitLab Node module: Node:Dependency:Download ->
# Node:Build + Node:Test:Unit.
#
# There is deliberately no production-install job. The packaging Dockerfile installs
# offline from the bind-mounted npm cache, so a separate job re-running the same
# `npm ci --omit=dev` proves nothing the image build does not, and a dependency
# directory is never an artifact.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Path to the Node project root. Monorepo children set this."
      build-command:
        required: false
        type: string
        default: "npm run build"
        description: "Build command."
      test-command:
        required: false
        type: string
        default: "npm test"
        description: "Unit test command. Must write JUnit XML into test-report/."
      build-artifact-path:
        required: false
        type: string
        default: "dist"
        description: "Directory produced by the build command."
      run-tests:
        required: false
        type: boolean
        default: true
        description: "Run the unit test job."
      build-env:
        required: false
        type: string
        default: ""
        description: "Newline-separated KEY=VALUE pairs exported into build and test."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TEST_REPORT_DIR: test-report
  npm_config_cache: ${{ github.workspace }}/.npm

jobs:
  dependency:
    name: Dependency Download
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # hashFiles returns "" when package-lock.json is absent, collapsing the key
      # onto the bare `node-` restore-keys prefix — a half-populated module tree
      # every later run would then prefix-match, valid package-lock.json or not.
      - name: Compute Dependency Cache Key
        id: key
        run: echo "key=node-${{ hashFiles(format('{0}/package-lock.json', inputs.project-path || vars.PROJECT_PATH || '.')) || 'nolock' }}" >> "${GITHUB_OUTPUT}"

      - name: Restore npm Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .npm
          key: ${{ steps.key.outputs.key }}
          restore-keys: node-

      - name: Download Dependencies
        id: download
        run: |
          set -uo pipefail
          # Capture as well as stream: npm names the package and the resolution
          # or integrity error that stopped it, and that sentence is the whole
          # answer. An exit code on its own is not.
          npm ci --include=dev --prefer-offline --no-audit --no-fund 2>&1 | tee "${RUNNER_TEMP}/npm-ci.log"
          exit "${PIPESTATUS[0]}"

      # GitLab inherits `when: always` here, which is safe there because a cache
      # key is rewritable — a partial tree from a failed resolve is overwritten
      # by the next green run. GitHub entries are immutable, so the same write
      # would freeze a half-populated tree under a perfectly valid key until
      # package-lock.json changes, and the build and test jobs would keep restoring it.
      - name: Save npm Cache
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .npm
          key: ${{ steps.key.outputs.key }}

      # Cache hit or miss is worth stating on a green run: it is what explains
      # the job's duration, and a key that never hits points at a lock file
      # that keeps changing. On a failure npm's own words go here too, since no
      # other job in the graph will report them.
      - name: Publish Dependency Summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.key.outputs.key }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          CACHE_STATE="rebuilt — no entry matched"
          [[ "${CACHE_HIT}" == "true" ]] && CACHE_STATE="restored"
          {
            echo "### 📗 Node dependencies"
            echo ""
            if [[ "${DOWNLOAD_OUTCOME}" == "success" ]]; then
              echo "✅ Dependencies installed. Cache \`${CACHE_KEY}\`: ${CACHE_STATE}."
            else
              echo "❌ \`npm ci\` failed. Cache \`${CACHE_KEY}\`: ${CACHE_STATE}. npm reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/npm-ci.log" 2>/dev/null || echo "(no output was captured)"
              echo '```'
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build
    needs: dependency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Export Build Environment
        if: ${{ inputs.build-env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          while IFS='=' read -r KEY VAL; do
            KEY="${KEY#"${KEY%%[![:space:]]*}"}"
            KEY="${KEY%"${KEY##*[![:space:]]}"}"
            [[ -z "${KEY}" || "${KEY}" =~ ^# ]] && continue
            printf '%s=%s\n' "${KEY}" "${VAL}" >> "${GITHUB_ENV}"
          done <<< "${BUILD_ENV}"

      - name: Restore npm Cache
        uses: actions/cache/restore@v6
        with:
          path: .npm
          key: ${{ needs.dependency.outputs.cache-key }}
          restore-keys: node-

      - name: Install Dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Build
        id: compile
        run: |
          set -uo pipefail
          # Braces, not a bare pipe: a build command may end in its own
          # redirect, and `cmd > file | tee` would hand tee an empty stream.
          { ${{ inputs.build-command }} ; } 2>&1 | tee "${RUNNER_TEMP}/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload Build Output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-dist
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/${{ inputs.build-artifact-path }}/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Publish Build Summary
        if: always()
        env:
          OUT_DIR: ${{ inputs.build-artifact-path }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### 📦 Node build"
            echo ""
            if [[ "${COMPILE_OUTCOME}" != "success" ]]; then
              # "No build output" is a symptom. The bundler already named the
              # module and the line, so that is what goes here.
              echo "❌ \`${BUILD_COMMAND}\` failed. It reported:"
              echo ""
              echo '```'
              tail -n 50 "${RUNNER_TEMP}/build.log" 2>/dev/null || echo "(no output was captured)"
              echo '```'
            elif [[ -d "${OUT_DIR}" ]]; then
              echo "✅ Output \`${OUT_DIR}/\` — $(du -sh "${OUT_DIR}" | cut -f1) across $(find "${OUT_DIR}" -type f | wc -l | tr -d ' ') files."
            else
              echo "⚠️ \`${BUILD_COMMAND}\` succeeded but wrote nothing to \`${OUT_DIR}/\`, so the \`node-dist\` artifact will be empty."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Unit Test
    if: ${{ inputs.run-tests }}
    needs: dependency
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
    env:
      NODE_ENV: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Export Test Environment
        if: ${{ inputs.build-env != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          set -euo pipefail
          while IFS='=' read -r KEY VAL; do
            KEY="${KEY#"${KEY%%[![:space:]]*}"}"
            KEY="${KEY%"${KEY##*[![:space:]]}"}"
            [[ -z "${KEY}" || "${KEY}" =~ ^# ]] && continue
            printf '%s=%s\n' "${KEY}" "${VAL}" >> "${GITHUB_ENV}"
          done <<< "${BUILD_ENV}"

      - name: Restore npm Cache
        uses: actions/cache/restore@v6
        with:
          path: .npm
          key: ${{ needs.dependency.outputs.cache-key }}
          restore-keys: node-

      - name: Install Dependencies
        run: npm ci --include=dev --prefer-offline --no-audit --no-fund

      - name: Run Unit Tests
        id: unit
        run: |
          set -uo pipefail
          mkdir -p "${TEST_REPORT_DIR}" coverage
          # Braces, not a bare pipe: a test command may end in its own redirect
          # into the JUnit file, and `cmd > file | tee` would hand tee an empty
          # stream.
          { ${{ inputs.test-command }} ; } 2>&1 | tee "${RUNNER_TEMP}/test.log"
          exit "${PIPESTATUS[0]}"

      # junit-report.sh reports the cases a JUnit file records. A test command
      # that never wrote one — a compile error, a missing runner — leaves it
      # nothing to report, so its own output has to be what explains the job.
      - name: Explain Test Runner Failure
        if: ${{ failure() && steps.unit.outcome == 'failure' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          {
            echo "### 🧪 Node test command"
            echo ""
            echo "❌ \`${TEST_COMMAND}\` exited non-zero. It reported:"
            echo ""
            echo '```'
            tail -n 50 "${RUNNER_TEMP}/test.log" 2>/dev/null || echo "(no output was captured)"
            echo '```'
            echo ""
            echo "Per-case results, where the run got far enough to produce any, are in the table below and in the \`node-test-reports\` artifact."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Test & Coverage Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-test-reports
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/test-report/
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Test Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NAME: "Node Unit Test Results"
          REPORT_GLOB: "${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/test-report/**/*.xml"
          JOB_SUMMARY: "true"
          FAIL_ON_FAILURE: "true"
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/junit-report.sh"
