name: Lint · Library
run-name: "Lint · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  self-lint:
    name: ${{ matrix.tool }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [actionlint, shellcheck, readme-dockerfiles, registry-lib]
    container:
      image: grootantech/toolkit:1.1.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run ${{ matrix.tool }}
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lint/summary.sh
          source scripts/lint/summary.sh
          case "${TOOL}" in
            actionlint)  run_linted "🔧 Self lint: actionlint" actionlint ;;
            shellcheck)  mapfile -t SCRIPTS < <(find scripts tests -name "*.sh" | sort)
                         run_linted "🔧 Self lint: shellcheck" shellcheck "${SCRIPTS[@]}" ;;
            readme-dockerfiles) scripts/lint/readme-dockerfile.sh ;;
            registry-lib) run_linted "🔧 Self test: registry helper" bash tests/registry/lib.test.sh ;;
          esac
