name: Lint · Library

# One dimension of the library's own pipeline, callable on its own so a change
# to a linter or a script can be verified without running the whole CI run.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # actionlint and shellcheck ship in the organisation build container.
  self-lint:
    name: ${{ matrix.tool }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [actionlint, shellcheck]
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # run_linted is the same helper markdown-lint.sh and yaml-lint.sh use, so
      # the library's own lint reports exactly as a consumer's does — findings
      # in the summary, not an exit code. `-color` is dropped: ANSI escapes in
      # a fenced markdown block are noise.
      - name: Run ${{ matrix.tool }}
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lint-summary.sh
          source scripts/lint-summary.sh
          case "${TOOL}" in
            actionlint)  run_linted "🔧 Self lint: actionlint" actionlint ;;
            shellcheck)  run_linted "🔧 Self lint: shellcheck" shellcheck scripts/*.sh scripts/checks/*.sh ;;
          esac

  lint:
    name: Config & Docs
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    with:
      lint-yaml-files: ".github/workflows/*.yml .yamllint.yml"
