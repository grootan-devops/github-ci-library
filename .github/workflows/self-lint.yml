name: Lint · Library
run-name: "Lint · ${{ github.ref_name }} · #${{ github.run_number }}"

# Lint dimension of the library's own pipeline, callable on its own.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # actionlint, shellcheck and hadolint ship in the organisation build container.
  self-lint:
    name: ${{ matrix.tool }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [actionlint, shellcheck, readme-dockerfiles]
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # run_linted reports findings in the step summary rather than as an exit code.
      - name: Run ${{ matrix.tool }}
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lint-summary.sh
          source scripts/lint-summary.sh
          case "${TOOL}" in
            actionlint)  run_linted "🔧 Self lint: actionlint" actionlint ;;
            shellcheck)  run_linted "🔧 Self lint: shellcheck" shellcheck scripts/*.sh scripts/checks/*.sh ;;
            readme-dockerfiles) scripts/readme-dockerfile-check.sh README.md ;;
          esac

  lint:
    name: Config & Docs
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    with:
      lint-yaml-files: ".github/workflows/*.yml .yamllint.yml"
