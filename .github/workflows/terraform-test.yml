name: Terraform / Module Test

# Counterpart of the GitLab Terraform:Module:Test and
# Terraform:Module:Test:Destroy jobs. The destroy job runs when the test job
# fails or is cancelled, so a test that provisioned real infrastructure and then
# stopped does not leave it behind.
#
# GitLab pinned `interruptible: false` on both jobs. The GitHub equivalent is on
# the caller: the workflow calling this one must set `cancel-in-progress: false`
# in its concurrency group, or a superseded run is force-cancelled before the
# teardown job can claim a runner and the fixtures stay provisioned.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Project root. Monorepo children set this."
      test-timeout:
        required: false
        type: string
        default: "1h"
        description: "go test timeout for the module test suite."
      destroy-on-failure:
        required: false
        type: boolean
        default: true
        description: "Run terraform destroy when the test job fails or is cancelled."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  TF_LOG_FILE_NAME: tf_test.log
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  # GitLab gates the module test on `exists: ${PROJECT_PATH}/main.tf`. An empty
  # matrix is the GitHub equivalent, and here it is a safety gate rather than a
  # tidiness one: this workflow provisions real infrastructure, so a repository
  # with no root module must produce no test job at all.
  discover:
    name: Detect Terraform Root Module
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      root: ${{ steps.targets.outputs.root }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Applicable Terraform Jobs
        id: targets
        env:
          PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_PATH}"

          ROOT='[]'
          if [[ -f main.tf ]]; then
            ROOT='[{"module":"root"}]'
          else
            echo "::warning title=Terraform::No main.tf in ${PROJECT_PATH} — the module test does not apply."
          fi

          echo "root=${ROOT}" >> "${GITHUB_OUTPUT}"
          {
            echo "### 🌍 Terraform module test"
            echo ""
            if [[ "${ROOT}" == "[]" ]]; then
              echo "⏭️ Skipped — no \`main.tf\` root module."
            else
              echo "Root module found; the test suite will run."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Module Test
    needs: discover
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.root) }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Module Test Suite
        env:
          TF_TEST_TIMEOUT: ${{ inputs.test-timeout }}
        run: |
          set -euo pipefail
          cd tests
          go test -v -timeout "${TF_TEST_TIMEOUT}" 2>&1 | tee "${TF_LOG_FILE_NAME}"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-test-artifacts
          path: |
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/tests/tf_test.log
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/test_output.tf
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/terraform.tfstate
            ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}/terraform.tfstate.backup
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish Test Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          # The suite already wrote its own transcript to tf_test.log, and
          # `go test -v` ends with its PASS/FAIL/ok lines. Reuse those rather
          # than re-running anything to count.
          LOG="tests/${TF_LOG_FILE_NAME}"
          TALLY="$(grep -aE '^(--- FAIL|--- PASS|FAIL|ok|PASS)' "${LOG}" 2>/dev/null | tail -n 15 || true)"
          {
            echo "### 🌍 Terraform module test"
            echo ""
            case "${OUTCOME}" in
              success)   echo "✅ Passed." ;;
              failure)   echo "❌ Failed — the destroy job will tear down anything the test provisioned." ;;
              cancelled) echo "🚫 Cancelled — the destroy job will tear down anything the test provisioned." ;;
              *)         echo "Status: ${OUTCOME}" ;;
            esac
            if [[ -n "${TALLY}" ]]; then
              echo ""
              echo '```'
              echo "${TALLY}"
              echo '```'
            fi
            if [[ "${OUTCOME}" != "success" && -s "${LOG}" ]]; then
              echo ""
              echo "<details><summary>Last of the test transcript</summary>"
              echo ""
              echo '```'
              tail -n 50 "${LOG}"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "The whole transcript is \`tf_test.log\` in the \`terraform-test-artifacts\` artifact."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

  destroy:
    name: Test Teardown
    needs: test
    # A passing test tears down its own fixtures; this covers the two cases that
    # cannot. Cancellation is one of them — GitLab pinned `interruptible: false`
    # precisely so a cancelled run could not strand real infrastructure — so the
    # condition must not be `failure()` alone. `skipped` means the test never ran
    # and there is nothing provisioned to destroy.
    if: ${{ inputs.destroy-on-failure && (failure() || cancelled()) && needs.test.result != 'skipped' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Test State
        uses: actions/download-artifact@v8
        with:
          name: terraform-test-artifacts
          path: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

      - name: Destroy Test Infrastructure
        id: teardown
        run: |
          set -uo pipefail
          # Capture as well as stream: this is the one job whose outcome has to
          # be trusted without reading logs, because what it leaves behind
          # costs money. Terraform's own count line is the proof.
          {
            terraform init -input=false -no-color &&
            terraform destroy -auto-approve -input=false -no-color
          } 2>&1 | tee "${RUNNER_TEMP}/tf-destroy.log"
          exit "${PIPESTATUS[0]}"

      - name: Publish Teardown Summary
        if: always()
        env:
          OUTCOME: ${{ steps.teardown.outcome }}
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/tf-destroy.log"
          # Terraform prints "Destroy complete! N resources destroyed." itself.
          DESTROYED="$(grep -aE 'Destroy complete!' "${LOG}" 2>/dev/null | tail -n 1 || true)"
          {
            echo "### 🧹 Terraform test teardown"
            echo ""
            if [[ "${OUTCOME}" == "success" ]]; then
              echo "✅ ${DESTROYED:-Test infrastructure destroyed.}"
            else
              echo "❌ **Teardown did not complete — infrastructure may still be running and billing.** Terraform reported:"
              echo ""
              echo '```'
              tail -n 50 "${LOG}" 2>/dev/null || echo "(no output was captured)"
              echo '```'
              echo ""
              echo "The state file is in the \`terraform-test-artifacts\` artifact; destroy from it by hand."
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
