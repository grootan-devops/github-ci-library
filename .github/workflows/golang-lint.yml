name: Go / Lint

# Counterpart of the GitLab Go:Fmt, Go:Vet, Go:Lint and Go:Security:Scan jobs.
# One matrix leg per check, all running in parallel off the shared module cache.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Path to the Go module root. Monorepo children set this."
      linters:
        required: false
        type: string
        default: '["fmt","vet","golangci-lint","gosec"]'
        description: "JSON array of checks to run in parallel."
      golangci-timeout:
        required: false
        type: string
        default: "60m"
        description: "golangci-lint run timeout."

env:
  PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
  GOPATH: ${{ github.workspace }}/.go-cache
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: "Go Lint: ${{ matrix.linter }}"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        linter: ${{ fromJSON(inputs.linters) }}
    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2
    defaults:
      run:
        working-directory: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout CI Library
        if: ${{ matrix.linter == 'vet' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Restore Module Cache
        uses: actions/cache/restore@v6
        with:
          path: .go-cache
          key: go-${{ hashFiles(format('{0}/go.sum', inputs.project-path || vars.PROJECT_PATH || '.')) }}
          restore-keys: go-

      - name: Run ${{ matrix.linter }}
        env:
          LINTER: ${{ matrix.linter }}
          GOLANGCI_TIMEOUT: ${{ inputs.golangci-timeout }}
        run: |
          set -euo pipefail
          case "${LINTER}" in
            fmt)
              go fmt ./...
              if [[ -n "$(git --no-pager diff)" ]]; then
                git --no-pager diff
                echo "::error title=go fmt::Formatting drift. Run 'go fmt ./...' and 'go mod tidy' locally and push the result."
                exit 1
              fi
              echo "Formatting and dependency check passed."
              ;;
            vet)
              bash "${GITHUB_WORKSPACE}/.ci-library/scripts/go-vet.sh"
              ;;
            golangci-lint)
              golangci-lint run --timeout "${GOLANGCI_TIMEOUT}"
              ;;
            gosec)
              gosec -exclude-generated -exclude-dir=.go-cache ./...
              ;;
            *)
              echo "::error title=Lint::Unknown Go check '${LINTER}'."
              exit 1
              ;;
          esac

      - name: Publish Lint Summary
        if: always()
        env:
          LINTER: ${{ matrix.linter }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### 🐹 Go lint: ${LINTER}"
            echo ""
            case "${OUTCOME}" in
              success) echo "✅ Passed." ;;
              failure) echo "❌ Failed. See the job log for the offending files." ;;
              *)       echo "Status: ${OUTCOME}" ;;
            esac
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
