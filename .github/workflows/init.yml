name: Init / Environment & Version Discovery

# Counterpart of the GitLab `Common:Init` job. Resolves every version, tag and
# repository path once, so no downstream workflow recomputes them and no caller
# has to pass them in.

on:
  workflow_call:
    inputs:
      project-path:
        required: false
        type: string
        default: ""
        description: "Path to the project root. Monorepo children set this; everything else leaves it empty."
      chart-dir:
        required: false
        type: string
        default: ""
        description: "Directory containing Chart.yaml. Defaults to vars.CHART_DIR, then ./chart."
      tag:
        required: false
        type: string
        default: ""
        description: "Explicit release version override. Normally discovered from the project manifest."
      ignore-chart:
        required: false
        type: string
        default: "auto"
        description: "auto | true | false. auto detects whether <chart-dir>/Chart.yaml exists."
      ignore-docker:
        required: false
        type: string
        default: "auto"
        description: "auto | true | false. auto detects whether the Dockerfile exists."

    outputs:
      tag:
        description: "Resolved release version tag"
        value: ${{ jobs.initialize.outputs.TAG }}
      release-version:
        description: "Discovered application version, before any release suffix"
        value: ${{ jobs.initialize.outputs.RELEASE_VERSION }}
      is-release:
        description: "true when this run publishes production artifacts"
        value: ${{ jobs.initialize.outputs.IS_RELEASE }}
      version-suffix:
        description: "Candidate suffix applied to this run's artifacts ('' on a release)"
        value: ${{ jobs.initialize.outputs.VERSION_SUFFIX }}
      ignore-chart:
        description: "Resolved ignore-chart decision"
        value: ${{ jobs.initialize.outputs.IGNORE_CHART }}
      ignore-docker:
        description: "Resolved ignore-docker decision"
        value: ${{ jobs.initialize.outputs.IGNORE_DOCKER }}
      registry:
        description: "Resolved container & chart registry host"
        value: ${{ jobs.initialize.outputs.REGISTRY }}
      image-tag:
        description: "Base container image tag (application version)"
        value: ${{ jobs.initialize.outputs.IMAGE_TAG }}
      image-push-tag:
        description: "Image tag this run publishes, candidate suffix included"
        value: ${{ jobs.initialize.outputs.IMAGE_PUSH_TAG }}
      image-repository:
        description: "Production container image repository (also the duplicate-check target)"
        value: ${{ jobs.initialize.outputs.IMAGE_REPOSITORY }}
      image-dev-repository:
        description: "Candidate container image repository"
        value: ${{ jobs.initialize.outputs.IMAGE_DEV_REPOSITORY }}
      image-push-repository:
        description: "Repository this run pushes to (dev or production)"
        value: ${{ jobs.initialize.outputs.IMAGE_PUSH_REPOSITORY }}
      chart-name:
        description: "Helm chart name"
        value: ${{ jobs.initialize.outputs.CHART_NAME }}
      chart-version:
        description: "Base Helm chart version"
        value: ${{ jobs.initialize.outputs.CHART_VERSION }}
      chart-app-version:
        description: "Helm chart appVersion to publish"
        value: ${{ jobs.initialize.outputs.CHART_APP_VERSION }}
      chart-push-version:
        description: "Chart version this run publishes, candidate suffix included"
        value: ${{ jobs.initialize.outputs.CHART_PUSH_VERSION }}
      chart-repository:
        description: "Production Helm chart repository (also the duplicate-check target)"
        value: ${{ jobs.initialize.outputs.CHART_REPOSITORY }}
      chart-dev-repository:
        description: "Candidate Helm chart repository"
        value: ${{ jobs.initialize.outputs.CHART_DEV_REPOSITORY }}
      chart-push-repository:
        description: "Chart repository this run pushes to (dev or production)"
        value: ${{ jobs.initialize.outputs.CHART_PUSH_REPOSITORY }}
      chart-dir:
        description: "Resolved chart directory"
        value: ${{ jobs.initialize.outputs.CHART_DIR }}
      project-path:
        description: "Resolved project root"
        value: ${{ jobs.initialize.outputs.PROJECT_PATH }}
      major-version:
        description: "Major component of the release tag"
        value: ${{ jobs.initialize.outputs.MAJOR_VERSION }}
      minor-version:
        description: "Major.minor component of the release tag"
        value: ${{ jobs.initialize.outputs.MINOR_VERSION }}
      upstream-run-id:
        description: "Workflow run that built the merged pull request's candidate artifacts"
        value: ${{ jobs.initialize.outputs.UPSTREAM_RUN_ID }}
      merged-pr-number:
        description: "Pull request whose merge produced this release commit"
        value: ${{ jobs.initialize.outputs.MERGED_PR_NUMBER }}
      candidate-image-tag:
        description: "Exact dev container image tag published by the candidate build"
        value: ${{ jobs.initialize.outputs.CANDIDATE_IMAGE_TAG }}
      candidate-chart-version:
        description: "Exact dev Helm chart version published by the candidate build"
        value: ${{ jobs.initialize.outputs.CANDIDATE_CHART_VERSION }}

jobs:
  initialize:
    name: Environment Context
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read

    container:
      image: registry-1.docker.io/grootantech/toolkit:verify-v2

    env:
      PROJECT_PATH: ${{ inputs.project-path || vars.PROJECT_PATH || '.' }}
      CHART_DIR: ${{ inputs.chart-dir || vars.CHART_DIR || './chart' }}
      CHART_FILE: ${{ vars.CHART_FILE || 'Chart.yaml' }}
      DOCKERFILE: ${{ vars.DOCKERFILE || 'Dockerfile' }}
      REGISTRY_HOST: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_REPOSITORY_INPUT: ${{ vars.IMAGE_REPOSITORY }}
      CHART_REPOSITORY_INPUT: ${{ vars.CHART_REPOSITORY || 'helm' }}
      IMAGE_DEV_REPOSITORY_SUFFIX: ${{ vars.IMAGE_DEV_REPOSITORY_SUFFIX }}
      CHART_DEV_REPOSITORY_SUFFIX: ${{ vars.CHART_DEV_REPOSITORY_SUFFIX || '/dev' }}
      RELEASE_VERSION_SUFFIX: ${{ vars.RELEASE_VERSION_SUFFIX }}
      MASTER_BRANCH_REGEX: ${{ vars.MASTER_BRANCH_REGEX || '^(.*/)?master$' }}
      UPSTREAM_WORKFLOW: ${{ vars.UPSTREAM_WORKFLOW || 'pr.yml' }}
      IGNORE_CHART_INPUT: ${{ inputs.ignore-chart }}
      IGNORE_DOCKER_INPUT: ${{ inputs.ignore-docker }}
      INPUT_TAG: ${{ inputs.tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    outputs:
      TAG: ${{ steps.version.outputs.TAG }}
      RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
      IS_RELEASE: ${{ steps.version.outputs.IS_RELEASE }}
      VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
      IGNORE_CHART: ${{ steps.version.outputs.IGNORE_CHART }}
      IGNORE_DOCKER: ${{ steps.version.outputs.IGNORE_DOCKER }}
      REGISTRY: ${{ steps.version.outputs.REGISTRY }}
      IMAGE_TAG: ${{ steps.version.outputs.IMAGE_TAG }}
      IMAGE_PUSH_TAG: ${{ steps.version.outputs.IMAGE_PUSH_TAG }}
      IMAGE_REPOSITORY: ${{ steps.version.outputs.IMAGE_REPOSITORY }}
      IMAGE_DEV_REPOSITORY: ${{ steps.version.outputs.IMAGE_DEV_REPOSITORY }}
      IMAGE_PUSH_REPOSITORY: ${{ steps.version.outputs.IMAGE_PUSH_REPOSITORY }}
      CHART_NAME: ${{ steps.version.outputs.CHART_NAME }}
      CHART_VERSION: ${{ steps.version.outputs.CHART_VERSION }}
      CHART_APP_VERSION: ${{ steps.version.outputs.CHART_APP_VERSION }}
      CHART_PUSH_VERSION: ${{ steps.version.outputs.CHART_PUSH_VERSION }}
      CHART_REPOSITORY: ${{ steps.version.outputs.CHART_REPOSITORY }}
      CHART_DEV_REPOSITORY: ${{ steps.version.outputs.CHART_DEV_REPOSITORY }}
      CHART_PUSH_REPOSITORY: ${{ steps.version.outputs.CHART_PUSH_REPOSITORY }}
      CHART_DIR: ${{ steps.version.outputs.CHART_DIR }}
      PROJECT_PATH: ${{ steps.version.outputs.PROJECT_PATH }}
      MAJOR_VERSION: ${{ steps.version.outputs.MAJOR_VERSION }}
      MINOR_VERSION: ${{ steps.version.outputs.MINOR_VERSION }}
      UPSTREAM_RUN_ID: ${{ steps.provenance.outputs.UPSTREAM_RUN_ID }}
      MERGED_PR_NUMBER: ${{ steps.provenance.outputs.MERGED_PR_NUMBER }}
      CANDIDATE_IMAGE_TAG: ${{ steps.provenance.outputs.CANDIDATE_IMAGE_TAG }}
      CANDIDATE_CHART_VERSION: ${{ steps.provenance.outputs.CANDIDATE_CHART_VERSION }}

    steps:
      - name: Validate Organisation Configuration
        run: |
          set -euo pipefail
          MISSING=()
          [[ -n "${REGISTRY_HOST}" ]] || MISSING+=("vars.IMAGE_REGISTRY")
          [[ -n "${IMAGE_REPOSITORY_INPUT}" ]] || MISSING+=("vars.IMAGE_REPOSITORY")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error title=Configuration::Set these organisation or repository variables: ${MISSING[*]}"
            {
              echo "## 🚀 CI/CD Version & Target Discovery"
              echo ""
              echo "❌ Not configured. Set these under **Settings → Secrets and variables → Actions → Variables**, on the organisation or on this repository:"
              echo ""
              # shellcheck disable=SC2016 # backticks are markdown, not command substitution
              printf -- '- `%s`\n' "${MISSING[@]}"
              echo ""
              echo "Nothing downstream can resolve a registry target without them, so no other job ran."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve Version & Registry Targets
        id: version
        run: |
          set -euo pipefail

          CHART_FILE_PATH="${PROJECT_PATH}/${CHART_DIR}/${CHART_FILE}"
          if [[ ! -f "${CHART_FILE_PATH}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
            CHART_FILE_PATH="${CHART_DIR}/${CHART_FILE}"
          fi

          DOCKERFILE_PATH="${PROJECT_PATH}/${DOCKERFILE}"
          if [[ ! -f "${DOCKERFILE_PATH}" && -f "${DOCKERFILE}" ]]; then
            DOCKERFILE_PATH="${DOCKERFILE}"
          fi

          resolve_ignore() {
            local VALUE="${1,,}" DETECTED="${2}"
            case "${VALUE}" in
              true|false) echo "${VALUE}" ;;
              auto|"")    echo "${DETECTED}" ;;
              *)
                echo "::error::Invalid value '${1}'. Expected one of: auto, true, false." >&2
                return 1
                ;;
            esac
          }

          CHART_DETECTED="true"
          [[ -f "${CHART_FILE_PATH}" ]] && CHART_DETECTED="false"
          DOCKER_DETECTED="true"
          [[ -f "${DOCKERFILE_PATH}" ]] && DOCKER_DETECTED="false"

          IGNORE_CHART="$(resolve_ignore "${IGNORE_CHART_INPUT}" "${CHART_DETECTED}")"
          IGNORE_DOCKER="$(resolve_ignore "${IGNORE_DOCKER_INPUT}" "${DOCKER_DETECTED}")"

          echo "Chart.yaml:  ${CHART_FILE_PATH} (ignore-chart=${IGNORE_CHART})"
          echo "Dockerfile:  ${DOCKERFILE_PATH} (ignore-docker=${IGNORE_DOCKER})"

          HAS_DOCKERFILE="false"
          if [[ "${IGNORE_DOCKER}" != "true" && -f "${DOCKERFILE_PATH}" ]]; then
            HAS_DOCKERFILE="true"
          fi

          CHART_NAME=""
          CHART_FILE_VERSION=""
          CHART_FILE_APP_VERSION=""
          if [[ "${IGNORE_CHART}" != "true" && -f "${CHART_FILE_PATH}" ]]; then
            CHART_NAME="$(yq -r '.name // ""' "${CHART_FILE_PATH}")"
            CHART_FILE_VERSION="$(yq -r '.version // ""' "${CHART_FILE_PATH}")"
            CHART_FILE_APP_VERSION="$(yq -r '.appVersion // ""' "${CHART_FILE_PATH}")"
          fi

          LANG_VERSION=""
          LANG_SOURCE=""
          if [[ -f "${PROJECT_PATH}/package.json" ]]; then
            LANG_VERSION="$(jq -r '.version // empty' "${PROJECT_PATH}/package.json")"
            LANG_SOURCE="package.json"
          fi
          if [[ -z "${LANG_VERSION}" && -f "${PROJECT_PATH}/pyproject.toml" ]]; then
            LANG_VERSION="$(yq -p toml -r '.project.version // .tool.poetry.version // ""' "${PROJECT_PATH}/pyproject.toml" 2>/dev/null || true)"
            if [[ -z "${LANG_VERSION}" || "${LANG_VERSION}" == "null" ]]; then
              LANG_VERSION="$(grep -E '^version[[:space:]]*=[[:space:]]*"' "${PROJECT_PATH}/pyproject.toml" \
                | head -n1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)"
            fi
            LANG_SOURCE="pyproject.toml"
          fi
          if [[ -z "${LANG_VERSION}" && -f "${PROJECT_PATH}/pom.xml" ]]; then
            LANG_VERSION="$(yq -p xml -r '.project.version // .project.parent.version // ""' "${PROJECT_PATH}/pom.xml" 2>/dev/null || true)"
            # shellcheck disable=SC2016 # the pattern matches a literal Maven placeholder
            if [[ -z "${LANG_VERSION}" || "${LANG_VERSION}" == "null" || "${LANG_VERSION}" == *'${'* ]]; then
              LANG_VERSION="$(mvn -f "${PROJECT_PATH}/pom.xml" help:evaluate \
                -Dexpression=project.version -q -DforceStdout --batch-mode 2>/dev/null | tail -n1 || true)"
            fi
            LANG_SOURCE="pom.xml"
          fi
          if [[ "${LANG_VERSION}" == "null" ]]; then
            LANG_VERSION=""
          fi

          if [[ -n "${LANG_VERSION}" ]]; then
            echo "Discovered application version ${LANG_VERSION} from ${LANG_SOURCE}."
            RELEASE_VERSION="${LANG_VERSION}"
            CHART_RELEASE_VERSION="${LANG_VERSION}"
          elif [[ -n "${CHART_FILE_VERSION}" || -n "${CHART_FILE_APP_VERSION}" ]]; then
            CHART_RELEASE_VERSION="${CHART_FILE_VERSION}"
            if [[ "${HAS_DOCKERFILE}" == "true" ]]; then
              echo "Discovered application version from Chart.yaml .appVersion (Dockerfile present)."
              RELEASE_VERSION="${CHART_FILE_APP_VERSION}"
            else
              echo "Discovered application version from Chart.yaml .version (no Dockerfile)."
              RELEASE_VERSION="${CHART_FILE_VERSION}"
            fi
          else
            RELEASE_VERSION=""
            CHART_RELEASE_VERSION=""
          fi

          if [[ -n "${INPUT_TAG}" ]]; then
            echo "Explicit tag override: ${INPUT_TAG}"
            RELEASE_VERSION="${INPUT_TAG}"
            CHART_RELEASE_VERSION="${INPUT_TAG}"
          fi

          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "::error title=Version discovery::No version found. Provide Chart.yaml, package.json, pyproject.toml, pom.xml, or the 'tag' input."
            {
              echo "## 🚀 CI/CD Version & Target Discovery"
              echo ""
              echo "❌ No application version could be discovered, so there is nothing to tag, build or publish."
              echo ""
              echo "| Manifest | Looked for | Present |"
              echo "|---|---|---|"
              for CANDIDATE in package.json pyproject.toml pom.xml; do
                if [[ -f "${PROJECT_PATH}/${CANDIDATE}" ]]; then FOUND="yes, but it declares no version"; else FOUND="no"; fi
                echo "| \`${CANDIDATE}\` | \`${PROJECT_PATH}/${CANDIDATE}\` | ${FOUND} |"
              done
              if [[ -f "${CHART_FILE_PATH}" ]]; then FOUND="yes, but it declares no version/appVersion"; else FOUND="no"; fi
              echo "| \`${CHART_FILE}\` | \`${CHART_FILE_PATH}\` | ${FOUND} |"
              echo ""
              echo "Add a version to one of them, or pass the \`tag\` input explicitly."
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ -z "${CHART_RELEASE_VERSION}" ]]; then
            CHART_RELEASE_VERSION="${RELEASE_VERSION}"
          fi

          REF_PROTECTED="${{ github.ref_protected || 'false' }}"
          IS_RELEASE_BRANCH="false"
          if [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            IS_RELEASE_BRANCH="true"
          elif [[ "${GITHUB_REF}" == refs/heads/* && "${REF_PROTECTED}" == "true" \
                  && "${GITHUB_REF_NAME}" =~ ${MASTER_BRANCH_REGEX} ]]; then
            IS_RELEASE_BRANCH="true"
          fi

          IS_MANUAL="false"
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch|repository_dispatch|schedule) IS_MANUAL="true" ;;
          esac

          if [[ "${IS_RELEASE_BRANCH}" == "true" && "${IS_MANUAL}" == "true" ]]; then
            echo "::warning title=Manual run::Manual trigger on release branch '${GITHUB_REF_NAME}' - forcing a candidate suffix and the dev repositories so a published artifact cannot be overwritten."
            VERSION_SUFFIX="-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            IS_RELEASE="false"
          elif [[ "${IS_RELEASE_BRANCH}" == "true" ]]; then
            VERSION_SUFFIX=""
            IS_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION_SUFFIX="-${GITHUB_RUN_NUMBER}.${PR_NUMBER}"
            IS_RELEASE="false"
          else
            VERSION_SUFFIX="-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            IS_RELEASE="false"
          fi

          IMAGE_REPO="${IMAGE_REPOSITORY_INPUT}"
          IMAGE_DEV_SUFFIX="${IMAGE_DEV_REPOSITORY_SUFFIX:-/dev}"
          # Docker Hub has no nested repositories, so `<repo>/dev` is not a valid target.
          case "${REGISTRY_HOST}" in
            docker.io|index.docker.io|registry-1.docker.io)
              NORMALISED_DEV_SUFFIX="${IMAGE_DEV_SUFFIX//\//-}"
              if [[ "${NORMALISED_DEV_SUFFIX}" != "${IMAGE_DEV_SUFFIX}" ]]; then
                echo "::notice title=Dev repository::Docker Hub does not support nested repositories. Using '${NORMALISED_DEV_SUFFIX}' instead of '${IMAGE_DEV_SUFFIX}' for development images."
              fi
              IMAGE_DEV_SUFFIX="${NORMALISED_DEV_SUFFIX}"
              ;;
          esac
          IMAGE_DEV_REPO="${IMAGE_REPO}${IMAGE_DEV_SUFFIX}"
          CHART_REPO="${CHART_REPOSITORY_INPUT}"
          CHART_DEV_REPO="${CHART_REPO}${CHART_DEV_REPOSITORY_SUFFIX}"

          if [[ "${IS_RELEASE}" == "true" ]]; then
            IMAGE_PUSH_REPOSITORY="${IMAGE_REPO}"
            CHART_PUSH_REPOSITORY="${CHART_REPO}"
          else
            IMAGE_PUSH_REPOSITORY="${IMAGE_DEV_REPO}"
            CHART_PUSH_REPOSITORY="${CHART_DEV_REPO}"
          fi

          TAG="${RELEASE_VERSION}"
          if [[ -n "${RELEASE_VERSION_SUFFIX}" ]]; then
            TAG="${RELEASE_VERSION}-${RELEASE_VERSION_SUFFIX}"
          fi

          IMAGE_PUSH_TAG="${RELEASE_VERSION}${VERSION_SUFFIX}"
          CHART_PUSH_VERSION="${CHART_RELEASE_VERSION}${VERSION_SUFFIX}"
          CHART_APP_VERSION="${IMAGE_PUSH_TAG}"

          MAJOR_VERSION="$(grep -Eo '^[0-9]+' <<<"${IMAGE_PUSH_TAG}" || true)"
          MINOR_VERSION="$(grep -Eo '^[0-9]+\.[0-9]+' <<<"${IMAGE_PUSH_TAG}" || true)"

          {
            echo "REGISTRY=${REGISTRY_HOST}"
            echo "TAG=${TAG}"
            echo "RELEASE_VERSION=${RELEASE_VERSION}"
            echo "VERSION_SUFFIX=${VERSION_SUFFIX}"
            echo "IS_RELEASE=${IS_RELEASE}"
            echo "IGNORE_CHART=${IGNORE_CHART}"
            echo "IGNORE_DOCKER=${IGNORE_DOCKER}"
            echo "IMAGE_TAG=${RELEASE_VERSION}"
            echo "IMAGE_PUSH_TAG=${IMAGE_PUSH_TAG}"
            echo "IMAGE_REPOSITORY=${IMAGE_REPO}"
            echo "IMAGE_DEV_REPOSITORY=${IMAGE_DEV_REPO}"
            echo "IMAGE_PUSH_REPOSITORY=${IMAGE_PUSH_REPOSITORY}"
            echo "CHART_NAME=${CHART_NAME}"
            echo "CHART_VERSION=${CHART_RELEASE_VERSION}"
            echo "CHART_APP_VERSION=${CHART_APP_VERSION}"
            echo "CHART_PUSH_VERSION=${CHART_PUSH_VERSION}"
            echo "CHART_REPOSITORY=${CHART_REPO}"
            echo "CHART_DEV_REPOSITORY=${CHART_DEV_REPO}"
            echo "CHART_PUSH_REPOSITORY=${CHART_PUSH_REPOSITORY}"
            echo "CHART_DIR=${CHART_DIR}"
            echo "PROJECT_PATH=${PROJECT_PATH}"
            echo "MAJOR_VERSION=${MAJOR_VERSION}"
            echo "MINOR_VERSION=${MINOR_VERSION}"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Resolve Upstream Candidate Provenance
        id: provenance
        if: ${{ steps.version.outputs.IS_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_IMAGE_TAG: ${{ steps.version.outputs.IMAGE_TAG }}
          BASE_CHART_VERSION: ${{ steps.version.outputs.CHART_VERSION }}
          IGNORE_DOCKER: ${{ steps.version.outputs.IGNORE_DOCKER }}
          IGNORE_CHART: ${{ steps.version.outputs.IGNORE_CHART }}
        run: |
          set -uo pipefail

          MERGED_PR_NUMBER=""
          UPSTREAM_HEAD_SHA=""
          UPSTREAM_RUN_ID=""
          UPSTREAM_RUN_NUMBER=""

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | first // empty' 2>/dev/null || true)"
          if [[ -n "${PR_JSON}" ]]; then
            MERGED_PR_NUMBER="$(jq -r '.number // empty' <<<"${PR_JSON}")"
            UPSTREAM_HEAD_SHA="$(jq -r '.head.sha // empty' <<<"${PR_JSON}")"
            [[ -n "${MERGED_PR_NUMBER}" ]] && echo "Resolved PR #${MERGED_PR_NUMBER} via commit/pulls association."
          fi

          if [[ -z "${UPSTREAM_HEAD_SHA}" ]]; then
            UPSTREAM_HEAD_SHA="$(git rev-parse HEAD^2 2>/dev/null || true)"
            [[ -n "${UPSTREAM_HEAD_SHA}" ]] && echo "Resolved head commit ${UPSTREAM_HEAD_SHA} via HEAD^2."
          fi

          if [[ -z "${MERGED_PR_NUMBER}" && -n "${UPSTREAM_HEAD_SHA}" ]]; then
            MERGED_PR_NUMBER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${UPSTREAM_HEAD_SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
            [[ -n "${MERGED_PR_NUMBER}" ]] && echo "Resolved PR #${MERGED_PR_NUMBER} via upstream commit."
          fi

          if [[ -z "${MERGED_PR_NUMBER}" ]]; then
            CANDIDATE="$(git log -1 --pretty=%s | grep -oE '\(#[0-9]+\)' | tail -n1 | tr -dc '0-9' || true)"
            if [[ -n "${CANDIDATE}" ]]; then
              MERGED_PR_NUMBER="${CANDIDATE}"
              echo "Resolved PR #${MERGED_PR_NUMBER} from squash commit subject."
              if [[ -z "${UPSTREAM_HEAD_SHA}" ]]; then
                UPSTREAM_HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CANDIDATE}" --jq '.head.sha // empty' 2>/dev/null || true)"
              fi
            fi
          fi

          if [[ -z "${MERGED_PR_NUMBER}" ]]; then
            MERGED_PR_NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --json number,mergeCommit --jq ".[] | select(.mergeCommit.oid == \"${GITHUB_SHA}\") | .number" 2>/dev/null | head -n1 || true)"
            [[ -n "${MERGED_PR_NUMBER}" ]] && echo "Resolved PR #${MERGED_PR_NUMBER} via merge commit search."
          fi

          if [[ -n "${UPSTREAM_HEAD_SHA}" ]]; then
            UPSTREAM_RUN_JSON="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow "${UPSTREAM_WORKFLOW}" --commit "${UPSTREAM_HEAD_SHA}" \
              --status success --limit 1 --json databaseId,number 2>/dev/null || echo '[]')"
            UPSTREAM_RUN_ID="$(jq -r '.[0].databaseId // empty' <<<"${UPSTREAM_RUN_JSON:-[]}" 2>/dev/null || true)"
            UPSTREAM_RUN_NUMBER="$(jq -r '.[0].number // empty' <<<"${UPSTREAM_RUN_JSON:-[]}" 2>/dev/null || true)"
            if [[ -n "${UPSTREAM_RUN_ID}" ]]; then
              echo "Upstream run ${UPSTREAM_RUN_ID} (${UPSTREAM_WORKFLOW}) will supply candidate artifacts."
              if [[ -z "${MERGED_PR_NUMBER}" ]]; then
                RUN_BRANCH="$(gh run view "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json headBranch --jq '.headBranch // empty' 2>/dev/null || true)"
                if [[ -n "${RUN_BRANCH}" ]]; then
                  MERGED_PR_NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state all --head "${RUN_BRANCH}" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
                  [[ -n "${MERGED_PR_NUMBER}" ]] && echo "Resolved PR #${MERGED_PR_NUMBER} from upstream run branch '${RUN_BRANCH}'."
                fi
              fi
            else
              echo "::warning title=Provenance::No successful '${UPSTREAM_WORKFLOW}' run found for ${UPSTREAM_HEAD_SHA}. Pre-release artifacts will not be attached to the release."
            fi
          fi

          if [[ -z "${MERGED_PR_NUMBER}" ]]; then
            echo "::warning title=Provenance::Could not resolve the merged pull request for ${GITHUB_SHA}. Promotion falls back to the newest matching tag."
          fi

          CANDIDATE_SUFFIX=""
          if [[ -n "${UPSTREAM_RUN_NUMBER}" && -n "${MERGED_PR_NUMBER}" ]]; then
            CANDIDATE_SUFFIX="-${UPSTREAM_RUN_NUMBER}.${MERGED_PR_NUMBER}"
          fi

          CANDIDATE_IMAGE_TAG=""
          CANDIDATE_CHART_VERSION=""
          if [[ -n "${CANDIDATE_SUFFIX}" ]]; then
            if [[ "${IGNORE_DOCKER}" != "true" && -n "${BASE_IMAGE_TAG}" ]]; then
              CANDIDATE_IMAGE_TAG="${BASE_IMAGE_TAG}${CANDIDATE_SUFFIX}"
            fi
            if [[ "${IGNORE_CHART}" != "true" && -n "${BASE_CHART_VERSION}" ]]; then
              CANDIDATE_CHART_VERSION="${BASE_CHART_VERSION}${CANDIDATE_SUFFIX}"
            fi
            echo "Exact promotion candidate: image '${CANDIDATE_IMAGE_TAG:-n/a}', chart '${CANDIDATE_CHART_VERSION:-n/a}'."
          fi

          {
            echo "MERGED_PR_NUMBER=${MERGED_PR_NUMBER}"
            echo "UPSTREAM_HEAD_SHA=${UPSTREAM_HEAD_SHA}"
            echo "UPSTREAM_RUN_ID=${UPSTREAM_RUN_ID}"
            echo "UPSTREAM_RUN_NUMBER=${UPSTREAM_RUN_NUMBER}"
            echo "CANDIDATE_IMAGE_TAG=${CANDIDATE_IMAGE_TAG}"
            echo "CANDIDATE_CHART_VERSION=${CANDIDATE_CHART_VERSION}"
          } | tee -a "${GITHUB_OUTPUT}"

      # The failure paths above write their own summary section; this one needs a
      # resolved version.
      - name: Publish Initialization Summary
        if: ${{ always() && steps.version.outcome == 'success' }}
        env:
          IGNORE_CHART: ${{ steps.version.outputs.IGNORE_CHART }}
          IGNORE_DOCKER: ${{ steps.version.outputs.IGNORE_DOCKER }}
          IS_RELEASE: ${{ steps.version.outputs.IS_RELEASE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.version.outputs.TAG }}
          VERSION_SUFFIX: ${{ steps.version.outputs.VERSION_SUFFIX }}
          IMAGE_PUSH_TAG: ${{ steps.version.outputs.IMAGE_PUSH_TAG }}
          IMAGE_PUSH_REPOSITORY: ${{ steps.version.outputs.IMAGE_PUSH_REPOSITORY }}
          IMAGE_DEV_REPOSITORY: ${{ steps.version.outputs.IMAGE_DEV_REPOSITORY }}
          IMAGE_REPOSITORY: ${{ steps.version.outputs.IMAGE_REPOSITORY }}
          CHART_PUSH_VERSION: ${{ steps.version.outputs.CHART_PUSH_VERSION }}
          CHART_PUSH_REPOSITORY: ${{ steps.version.outputs.CHART_PUSH_REPOSITORY }}
          CHART_DEV_REPOSITORY: ${{ steps.version.outputs.CHART_DEV_REPOSITORY }}
          CHART_REPOSITORY: ${{ steps.version.outputs.CHART_REPOSITORY }}
          MERGED_PR_NUMBER: ${{ steps.provenance.outputs.MERGED_PR_NUMBER }}
          UPSTREAM_HEAD_SHA: ${{ steps.provenance.outputs.UPSTREAM_HEAD_SHA }}
          UPSTREAM_RUN_ID: ${{ steps.provenance.outputs.UPSTREAM_RUN_ID }}
          CANDIDATE_IMAGE_TAG: ${{ steps.provenance.outputs.CANDIDATE_IMAGE_TAG }}
          CANDIDATE_CHART_VERSION: ${{ steps.provenance.outputs.CANDIDATE_CHART_VERSION }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch) TRIGGER="Manual" ;;
            pull_request)      TRIGGER="Pull request #${PR_NUMBER}" ;;
            push)              TRIGGER="Push to \`${GITHUB_REF_NAME}\`" ;;
            schedule)          TRIGGER="Schedule" ;;
            *)                 TRIGGER="${GITHUB_EVENT_NAME}" ;;
          esac

          WANT_IMAGE=false; [[ "${IGNORE_DOCKER}" != "true" ]] && WANT_IMAGE=true
          WANT_CHART=false; [[ "${IGNORE_CHART}" != "true" ]] && WANT_CHART=true

          {
            echo "## 🚀 Version & Targets"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **Trigger** | ${TRIGGER} |"
            echo "| **Release tag** | \`${TAG}\` |"
            if [[ "${IS_RELEASE}" == "true" ]]; then
              echo "| **Build type** | 🚀 Production release |"
            else
              echo "| **Build type** | 🔍 Candidate \`${VERSION_SUFFIX}\` |"
            fi
            [[ "${WANT_IMAGE}" == "true" ]] && echo "| **Image tag** | \`${IMAGE_PUSH_TAG}\` |"
            [[ "${WANT_CHART}" == "true" ]] && echo "| **Chart version** | \`${CHART_PUSH_VERSION}\` |"

            if [[ "${WANT_IMAGE}" == "true" || "${WANT_CHART}" == "true" ]]; then
              echo ""
              echo "| Artifact | Pushes to | Production |"
              echo "|---|---|---|"
              [[ "${WANT_IMAGE}" == "true" ]] && echo "| Image | \`${IMAGE_PUSH_REPOSITORY}\` | \`${IMAGE_REPOSITORY}\` |"
              [[ "${WANT_CHART}" == "true" ]] && echo "| Chart | \`${CHART_PUSH_REPOSITORY}\` | \`${CHART_REPOSITORY}\` |"
            fi

            if [[ "${IS_RELEASE}" == "true" ]]; then
              echo ""
              echo "### 🔗 Promotion source"
              echo ""
              echo "| Property | Value |"
              echo "|---|---|"
              if [[ -n "${MERGED_PR_NUMBER}" ]]; then
                echo "| Merged pull request | [#${MERGED_PR_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${MERGED_PR_NUMBER}) |"
              else
                echo "| Merged pull request | ⚠️ unresolved |"
              fi
              echo "| Upstream commit | \`${UPSTREAM_HEAD_SHA:-unresolved}\` |"
              if [[ -n "${UPSTREAM_RUN_ID}" ]]; then
                echo "| Upstream run | [${UPSTREAM_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}) |"
              else
                echo "| Upstream run | ⚠️ unresolved |"
              fi
              if [[ "${WANT_IMAGE}" == "true" ]]; then
                if [[ -n "${CANDIDATE_IMAGE_TAG}" ]]; then
                  echo "| Image candidate | \`${CANDIDATE_IMAGE_TAG}\` |"
                else
                  echo "| Image candidate | ⚠️ unresolved, promotion searches by tag |"
                fi
              fi
              if [[ "${WANT_CHART}" == "true" ]]; then
                if [[ -n "${CANDIDATE_CHART_VERSION}" ]]; then
                  echo "| Chart candidate | \`${CANDIDATE_CHART_VERSION}\` |"
                else
                  echo "| Chart candidate | ⚠️ unresolved, promotion searches by version |"
                fi
              fi
            fi
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
