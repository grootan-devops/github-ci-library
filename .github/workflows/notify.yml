name: Notify / Microsoft Teams

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Version the card announces."
      changelog-artifact:
        required: false
        type: string
        default: ""
        description: "Artifact holding RELEASE_CHANGELOG.md / RELEASE_CHANGELOG_CARD.json."

permissions:
  contents: read

jobs:
  notify:
    name: Teams
    # A Teams outage must not turn the caller's run red.
    continue-on-error: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: grootantech/toolkit:1.0.0

    steps:
      - name: Checkout CI Library
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-library
          token: ${{ secrets.CI_LIBRARY_TOKEN || github.token }}

      - name: Download Changelog Artifact
        if: ${{ inputs.changelog-artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.changelog-artifact }}
          path: .

      - name: Send Teams Adaptive Card
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL: ${{ secrets.RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL }}
          SONAR_EXTERNAL_URL: ${{ vars.SONAR_EXTERNAL_URL || vars.SONAR_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: bash "${GITHUB_WORKSPACE}/.ci-library/scripts/notify/teams.sh"

      - name: Upload Notification Payload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: teams-notification
          path: message.json
          if-no-files-found: ignore
          retention-days: 7
